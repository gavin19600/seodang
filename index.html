<!doctype html>
<html lang="ko">
<head>

<meta property="og:title" content="한문김선생의 온라인서당">

<meta name="theme-color" content="#2d5a86">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

[hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 걸어 다니는 3D 서당 마을 전체 화면 + 한지 HUD, 방에 들어가면 한지 두루마리 패널 (단일 톤, 가을 오후) */
:root{
  --ink:#2a231e; --ink-soft:#6a5d52;
  --hanji:#f6efe1; --hanji-deep:#ece1c9; --edge:#d6c5a2;
  --jjok:#2d5a86; --juchil:#b23a2c; --gold:#c8962e; --pine:#4f7a55;
  --sky:#cfe0ea;
  --display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;z-index:5}
.logo{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;
  background:var(--hanji);border:1px solid var(--edge);padding:6px 14px 6px 6px;border-radius:4px;box-shadow:0 2px 10px rgba(60,40,20,.14)}
.seal{width:34px;height:34px;background:var(--juchil);color:#fbefe3;font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:20px;border-radius:3px}
.logo b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.status{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 200px)}
.chip{background:var(--hanji);border:1px solid var(--edge);border-radius:3px;padding:7px 11px;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 10px rgba(60,40,20,.12);font-variant-numeric:tabular-nums}
.chip b{font-family:var(--display)}
.chip.people.off{opacity:.5}
.chip.grade{background:var(--jjok);color:#f6efe1;border-color:var(--jjok)}
button{font:inherit}
.chip.btn{cursor:pointer}
.help{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:12px;background:rgba(246,239,225,.82);padding:4px 10px;border-radius:2px;pointer-events:none}
.mini{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:120px;height:113px;border:1px solid var(--edge);border-radius:3px;box-shadow:0 2px 10px rgba(60,40,20,.18);cursor:pointer}
@media (max-width:640px){.mini{display:none}}
.act{left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--juchil);color:#fbefe3;border:0;border-radius:3px;
  padding:12px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(120,30,20,.35);cursor:pointer;white-space:nowrap}
.act small{font-weight:400;opacity:.8;margin-left:8px;font-size:12px}
.where{left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--display);font-size:15px;background:rgba(246,239,225,.88);padding:4px 14px;border-radius:2px;pointer-events:none;white-space:nowrap}
.joy{left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(246,239,225,.55);border:1px solid var(--edge);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--hanji);border:1px solid var(--edge);box-shadow:0 2px 8px rgba(60,40,20,.2)}
@media (hover:hover) and (pointer:fine){.joy{display:none}}
.act:focus-visible,.chip.btn:focus-visible,.pbtn:focus-visible,.x:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}

/* 패널 */
.veil{position:absolute;inset:0;z-index:8;background:rgba(40,28,18,.35);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--hanji);border:1px solid var(--edge);border-radius:4px;box-shadow:0 20px 60px rgba(40,28,18,.35);position:relative}
.panel header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--edge);background:var(--hanji-deep);position:sticky;top:0;z-index:1}
.panel header .ttl{font-family:var(--display);font-size:22px;font-weight:700}
.panel header .sub{font-size:13px;color:var(--ink-soft)}
.x{white-space:nowrap;flex:none;margin-left:auto;appearance:none;border:1px solid var(--edge);background:var(--hanji);border-radius:3px;padding:6px 12px;cursor:pointer}
.pb{padding:18px 20px 22px;display:grid;gap:14px}
.pb p{margin:0;line-height:1.65}
.big{font-family:var(--display);font-size:92px;line-height:1;text-align:center;color:var(--ink)}
.hun{text-align:center;font-family:var(--display);font-size:22px}
.note{font-size:13px;color:var(--ink-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{appearance:none;border:1px solid var(--edge);background:#fffaf0;border-radius:3px;padding:9px 14px;cursor:pointer;font-size:15px;color:var(--ink)}
.pbtn.main{background:var(--juchil);border-color:var(--juchil);color:#fbefe3;font-weight:700}
.pbtn.blue{background:var(--jjok);border-color:var(--jjok);color:#f6efe1}
.pbtn.on{background:var(--jjok);color:#f6efe1;border-color:var(--jjok)}
.pbtn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.verse{font-family:var(--display);font-size:34px;text-align:center;letter-spacing:.12em}
.eum{text-align:center;color:var(--jjok);font-size:17px;letter-spacing:.08em}
.words{display:flex;gap:6px;flex-wrap:wrap}
.word{background:#fffaf0;border:1px dashed var(--edge);border-radius:2px;padding:4px 10px;font-size:14px}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1px solid var(--edge);background:#fffdf7;border-radius:3px;padding:10px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fish{font-family:var(--display);font-size:40px;padding:14px 0}
.ok{color:var(--pine);font-weight:700}.ng{color:var(--juchil);font-weight:700}
.speech{background:#fffaf0;border:1px solid var(--edge);border-left:5px solid var(--jjok);border-radius:3px;padding:12px 14px;line-height:1.7;font-family:var(--display);font-size:16px}
.brushwrap{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1;background:#fbf6ea;border:1px solid var(--edge)}
.brushwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.album img{width:100%;aspect-ratio:1;background:#fbf6ea;border:1px solid var(--edge)}
.thought{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:8px 12px;font-size:14px}
.thought b{font-family:var(--display);color:var(--jjok);margin-right:6px}
.story{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:16px;min-height:96px;line-height:1.75}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--edge)}.dots i.on{background:var(--juchil)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--edge);padding:7px 6px;text-align:left}
.hanrow{display:grid;gap:10px;justify-items:center}
.hanline{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.hanline .sp{width:14px}
.hj{appearance:none;border:1px solid var(--edge);background:#fffaf0;border-radius:3px;padding:6px 3px 4px;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font:inherit}
.hj:hover{border-color:var(--jjok)}.hj:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}
.hc{font-family:var(--display);font-size:30px;line-height:1.1}.hh{font-size:11px;color:var(--jjok);white-space:nowrap}
.pil{color:var(--juchil);font-family:var(--display);font-weight:700}.pbtn.on .pil{color:#ffd9cf}
.seal-big{display:inline-grid;place-items:center;width:46px;height:46px;border:3px solid var(--juchil);color:var(--juchil);font-family:var(--display);font-size:27px;font-weight:700;border-radius:4px;transform:rotate(-8deg)}
.minigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.minigrid .pbtn{font-family:var(--display);font-size:20px;padding:6px 0}.minigrid .today{border:2px solid var(--juchil)}
.yj{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:10px 14px}.yj summary{cursor:pointer}.yj ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;line-height:1.55;font-size:14px}
.pbtn.on:disabled{opacity:1}
@media (max-width:640px){.hj{min-width:44px}.hc{font-size:24px}.hh{font-size:10px}}
a.pbtn.lk{text-decoration:none;display:inline-block}
.gamerow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:10px 12px}
.gic{font-family:var(--display);font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:var(--juchil);color:#fbefe3;border-radius:3px}
@media (max-width:640px){.gamerow{grid-template-columns:auto 1fr}.gamerow .row{grid-column:1/-1}}
.moves{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.mv{appearance:none;width:74px;height:74px;border-radius:50%;border:1px solid var(--edge);background:rgba(246,239,225,.9);color:var(--ink);cursor:pointer;display:grid;place-content:center;gap:1px;box-shadow:0 3px 12px rgba(60,40,20,.2);touch-action:manipulation;font:inherit}
.mv .ei{font-size:30px;line-height:1}.mv b{font-family:var(--body);font-size:12px;font-weight:700}
.mv[aria-pressed="true"]{background:var(--jjok);border-color:var(--jjok);color:#f6efe1}
.mv:active{transform:scale(.94)}.mv:focus-visible{outline:2px solid var(--juchil);outline-offset:2px}
a.act{text-decoration:none;display:inline-block}
.entry{z-index:12;background:rgba(40,28,18,.5)}
.entry .panel{width:min(520px,100%)}
.enrow{display:grid;gap:8px}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emo{appearance:none;aspect-ratio:1;border:1px solid var(--edge);background:#fffaf0;border-radius:50%;font-size:26px;cursor:pointer;display:grid;place-items:center;padding:0}
.emo[aria-checked="true"]{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,46,.3)}
.colgrid{display:flex;gap:10px;flex-wrap:wrap}
.col{appearance:none;width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.col[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--hanji) inset}
.emo:focus-visible,.col:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:16px}
.pbtn.enter{width:100%;padding:13px;font-size:17px}
:root{--warp1:#7aa8ff;--warp2:#6a4fd0;--warp3:#ffd98a}
.warp{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:conic-gradient(from 0deg,var(--warp1),var(--warp2),var(--warp3),var(--warp1),var(--warp2),var(--warp3),var(--warp1));-webkit-mask:radial-gradient(circle,#000 0%,#000 40%,transparent 72%);mask:radial-gradient(circle,#000 0%,#000 40%,transparent 72%)}
.warp.go{animation:warp 1.3s ease-in forwards}
@keyframes warp{0%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:.9}100%{opacity:1;transform:scale(4) rotate(540deg);-webkit-mask:none;mask:none;filter:brightness(2.4)}}
@media (prefers-reduced-motion:reduce){.warp.go{animation:none;opacity:1}}
.poem{display:grid;gap:6px;justify-items:center;padding:6px 0}
.pl{text-align:center;padding:4px 14px;border-radius:4px;transition:background .3s}
.pl .ph{font-family:var(--display);font-size:32px;letter-spacing:.18em;line-height:1.2}
.pl .pe{color:var(--jjok);font-size:15px;letter-spacing:.3em}
.pl.on{background:#f6dfa0}
.medi{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  background:radial-gradient(circle at 50% 55%,rgba(20,40,50,.15),rgba(15,25,35,.55));color:#f6efe1;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.mtop{display:flex;gap:14px;align-items:baseline;background:rgba(20,30,35,.5);padding:6px 16px;border-radius:999px;font-family:var(--display)}
.mtop span{font-variant-numeric:tabular-nums;font-size:18px}
.mcenter{display:flex;flex-direction:column;align-items:center;gap:18px}
.mcircle{width:min(46vw,240px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(246,239,225,.55),rgba(143,184,255,.25) 60%,rgba(143,184,255,0) 72%);border:2px solid rgba(246,239,225,.7);transition:transform 1s linear}
.mword{font-family:var(--display);font-size:28px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mdone{background:rgba(246,239,225,.95);color:var(--ink);padding:20px;border-radius:4px;width:min(420px,100%);box-sizing:border-box}
.mdone p{margin:0;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.mcircle{transition:none}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;max-height:150px;overflow-y:auto;padding:2px}
.bgrid .pbtn{font-family:var(--display);font-size:22px;padding:6px 0}
.bhun{text-align:center;font-size:16px}.bhun b{font-family:var(--display);font-size:22px;margin-right:4px}
.talk{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:min(330px,calc(100% - 32px));background:var(--hanji);border:1px solid var(--edge);border-radius:6px;box-shadow:0 10px 30px rgba(60,40,20,.25);padding:10px;display:grid;gap:8px;z-index:7}
.tsay{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tsay button,.temo button{appearance:none;border:1px solid var(--edge);background:#fffaf0;border-radius:999px;padding:9px 8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.tsay button small{color:var(--ink-soft);font-size:11px;margin-right:4px}
.temo{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.temo button{font-size:22px;padding:6px 0}
.tsay button:hover,.temo button:hover{border-color:var(--jjok)}
.tsay button:focus-visible,.temo button:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}
@media (max-width:640px){.mv{width:62px;height:62px}.mv .ei{font-size:24px}.mv b{font-size:11px}}
.mv[aria-expanded="true"]{background:var(--gold);border-color:var(--gold)}
.exhead{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.exbar{height:8px;background:#e9dfc8;border-radius:4px;overflow:hidden}.exbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b23a2c,#d8b35a)}
.exbig{font-family:var(--display);font-size:68px;text-align:center;line-height:1.15}.exbig.sm{font-size:30px;letter-spacing:.12em}
.exopts{display:grid;gap:8px}.exopts .pbtn{text-align:left;padding:11px 14px}.exopts .pbtn small{color:var(--juchil);margin-right:4px}
.exopts.han{grid-template-columns:1fr 1fr}.exopts.han .pbtn{font-family:var(--display);font-size:30px;text-align:center}
.exres{text-align:center;padding:10px 0}.exstamp{display:inline-block;font-family:var(--display);font-size:46px;font-weight:700;padding:8px 22px;border:5px solid currentColor;border-radius:6px;transform:rotate(-6deg)}
.exres.pass .exstamp{color:var(--juchil)}.exres.fail .exstamp{color:#7a7266}
.lvgrid{display:grid;gap:8px}.lv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;text-align:left}.lv b{font-family:var(--display);font-size:20px}.lv small{color:var(--ink-soft)}
.rggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.schlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:240px;overflow-y:auto}
.schcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffaf0;border:1px solid var(--edge);border-left:5px solid var(--jjok);border-radius:3px;padding:10px 12px}

.rankhud{top:calc(116px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(320px,calc(100% - 32px));max-height:min(60vh,520px);display:flex;flex-direction:column;background:rgba(246,239,225,.96);border:1px solid var(--edge);border-top:4px solid var(--juchil);border-radius:4px;box-shadow:0 8px 24px rgba(60,40,20,.22);z-index:6}

.rhhead .pbtn{padding:4px 10px;font-size:13px}
.rhbody{overflow-y:auto;padding:0 10px 10px;display:grid;gap:8px}
.rhbody .tabs .pbtn{padding:4px 9px;font-size:13px}.rhbody table.t{font-size:13px}.rhbody table.t td,.rhbody table.t th{padding:5px 4px}.rhbody .myrank{font-size:13px;padding:6px 8px}

function mediTick(now,dt){if(!medi)return;const el=now-medi.t0,left=Math.max(0,medi.dur-el);yaw=Math.sin(el/1000*0.05)*0.7;
  const cyc=(el/1000)%10,inh=cyc<4,hold=cyc>=4&&cyc<5,k=inh?cyc/4:hold?1:cyc<9?1-(cyc-5)/4:0;
  const c=$("mediCircle");c.style.transform="scale("+(0.55+0.45*k)+")";$("mediWord").textContent=inh?"들이쉬고":hold?"잠깐 멈추고":cyc<9?"내쉬고":"…";
  const s=Math.ceil(left/1000);if(s!==medi.last){medi.last=s;$("mediTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
  if(left<=0)endMedi(false);}

const SAYS=["안녕하신가!","같이 공부하세","고맙소","장하다!","이리 와 보게","먼저 가겠소"];
const EMOS=["👋","👍","❤️","😂","👏","🙇"];
function bubbleTex(text,emoji){const cv=document.createElement("canvas");cv.width=512;cv.height=200;const c=cv.getContext("2d");
  c.font=emoji?"120px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif":"bold 58px 'Gowun Dodum',sans-serif";
  const w=emoji?190:Math.min(496,c.measureText(text).width+70),x=(512-w)/2,hh=emoji?150:110,y=emoji?8:30;
  c.fillStyle="#fffdf6";c.strokeStyle="#3a2f27";c.lineWidth=6;c.beginPath();if(c.roundRect)c.roundRect(x,y,w,hh,emoji?60:44);else c.rect(x,y,w,hh);c.fill();c.stroke();
  c.beginPath();c.moveTo(236,y+hh-3);c.lineTo(256,y+hh+34);c.lineTo(280,y+hh-3);c.closePath();c.fill();c.beginPath();c.moveTo(236,y+hh);c.lineTo(256,y+hh+34);c.lineTo(280,y+hh);c.stroke();
  c.fillStyle="#2a231e";c.textAlign="center";c.textBaseline="middle";c.fillText(text,256,y+hh/2+(emoji?6:3),w-40);
  const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;}
function makeBubble(text,emoji){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:bubbleTex(text,emoji),depthWrite:false,depthTest:false,transparent:true}));sp.renderOrder=11;sp.scale.set(2.6,1.02,1);scene.add(sp);return sp;}
let myBubble=null;
function setBubble(holder,text,emoji){if(holder.bubble){scene.remove(holder.bubble);holder.bubble.material.map.dispose();holder.bubble.material.dispose();}holder.bubble=makeBubble(text,emoji);holder.bubbleT=performance.now()+(emoji?3200:4500);}
const meHolder={};
function say(kind,i){const text=kind==="say"?SAYS[i]:EMOS[i];setBubble(meHolder,text,kind==="emote");SFX.open();
  if(roomApi){try{(kind==="say"?roomApi.emit("say",{i}):roomApi.emit("emote",{e:i})).catch(()=>{});}catch(e){}}}
$("tsay").innerHTML=SAYS.map((t,i)=>'<button data-i="'+i+'"><small>'+(i+1)+'</small>'+t+'</button>').join("");
$("temo").innerHTML=EMOS.map((t,i)=>'<button data-e="'+i+'" aria-label="이모티콘 '+(i+1)+'">'+t+'</button>').join("");
function talkOpen(v){$("talk").hidden=!v;$("talkBtn").setAttribute("aria-expanded",String(v));}
$("talkBtn").addEventListener("click",e=>{talkOpen($("talk").hidden);if(e.detail>0)e.currentTarget.blur();});
$("tsay").addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b)return;say("say",+b.dataset.i);talkOpen(false);});
$("temo").addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;say("emote",+b.dataset.e);talkOpen(false);});
addEventListener("keydown",e=>{const tag=(e.target.tagName||"");if(panelOpen||tag==="INPUT"||tag==="TEXTAREA"||!$("entry").hidden)return;const n=parseInt(e.key,10);if(n>=1&&n<=6){say("say",n-1);talkOpen(false);}});
function listenTalk(r){r.on("say",m=>{if(m.isMe)return;const P=peerMap.get(m.peer);if(P&&m.data&&SAYS[m.data.i])setBubble(P,SAYS[m.data.i],false);});
  r.on("emote",m=>{if(m.isMe)return;const P=peerMap.get(m.peer);if(P&&m.data&&EMOS[m.data.e])setBubble(P,EMOS[m.data.e],true);});}
function bubbleTick(now){const place=(H,x,y,z)=>{if(!H.bubble)return;if(now>H.bubbleT){scene.remove(H.bubble);H.bubble.material.map.dispose();H.bubble.material.dispose();H.bubble=null;return;}
    const k=Math.min(1,(H.bubbleT-now)/300);H.bubble.material.opacity=k;H.bubble.position.set(x,y,z);};
  place(meHolder,player.position.x,player.position.y+(S.grade>=4?3.05:2.55)+0.85,player.position.z);
  peerMap.forEach(P=>place(P,P.body.position.x,P.body.position.y+(P.g>=4?3.05:2.55)+0.85,P.body.position.z));}

  const qFind=(pool,n)=>pick(pool,n).forEach(c=>{const o=shuffle([c,...pick(pool.filter(x=>x!==c),3)]);Q.push({kind:"한자 찾기",big:hunOf(c),q:"훈과 음에 맞는 한자는?",opts:o,ans:o.indexOf(c),han:true});});

  const qWord=n=>pick(WORDS,n).forEach(W=>{const o=shuffle([W,...pick(WORDS.filter(x=>x.r!==W.r),3)]);Q.push({kind:"한자어 읽기",big:W.h,q:"이 한자어를 바르게 읽은 것은?",opts:o.map(x=>x.r),ans:o.indexOf(W)});});
  const qOrigin=n=>pick(HANJA,n).forEach(H=>{const o=shuffle([H,...pick(HANJA.filter(x=>x!==H),3)]);Q.push({kind:"상형",big:H.c,q:"이 글자는 무엇을 본떠 만들었을까요?",opts:o.map(x=>x.o),ans:o.indexOf(H)});});
  const qIdiom=(n,rev)=>pick(IDIOMS,n).forEach(I=>{const o=shuffle([I,...pick(IDIOMS.filter(x=>x!==I),3)]);
    Q.push(rev?{kind:"고사성어",big:I.m,q:"이 뜻을 가진 고사성어는?",opts:o.map(x=>x.c+" ("+x.e+")"),ans:o.indexOf(I),small:true}:{kind:"고사성어",big:I.c,sub:I.e,q:"이 고사성어의 뜻은?",opts:o.map(x=>x.m),ans:o.indexOf(I)});});
  const qBook=n=>pick(PIEONS,n).forEach(P=>{const o=shuffle([P,...pick(PIEONS.filter(x=>x!==P),3)]);Q.push({kind:"구절",big:P.lines.slice(0,2).join(" "),q:"이 구절이 실린 편은?",opts:o.map(x=>x.book+" · "+x.title),ans:o.indexOf(P),small:true});});
  const qMean=n=>pick(PIEONS,n).forEach(P=>{const o=shuffle([P,...pick(PIEONS.filter(x=>x!==P),3)]);Q.push({kind:"구절 풀이",big:P.lines.join(" "),q:"이 구절의 뜻은?",opts:o.map(x=>x.f),ans:o.indexOf(P),small:true});});
  const qAuthor=n=>pick(POEMS,n).forEach(P=>{const o=shuffle([P,...pick(POEMS.filter(x=>x!==P),3)]);Q.push({kind:"한시",big:P.l[0],q:"이 시구를 지은 사람은?",opts:o.map(x=>x.au.split(" ")[0]),ans:o.indexOf(P),small:true});});
  const qRead=n=>pick(POEMS,n).forEach(P=>{const k=Math.floor(Math.random()*4);const others=pick(POEMS.filter(x=>x!==P),3).map(x=>x.e[Math.floor(Math.random()*4)]);const o=shuffle([P.e[k],...others]);
    Q.push({kind:"한시 읽기",big:P.l[k],q:"이 시구를 바르게 읽은 것은?",opts:o,ans:o.indexOf(P.e[k]),small:true});});
  if(lv==="초"){qHun(EASY,4);qFind(EASY,3);qOrigin(2);qWord(1);}
  else if(lv==="고"){qHun(HARD,2);qFind(HARD,1);qIdiom(2,true);qMean(2);qRead(2);qAuthor(1);}
  else{qHun(MID,2);qWord(1);qFind(MID,2);qIdiom(2,false);qBook(1);qAuthor(1);qRead(1);}
  return shuffle(Q);}

/* ---------- 학교 순위 (공개 사이트: Firebase 'gwrank') ---------- */
const RANK={data:{},on:false,ready:false,err:null};
function schoolKey(s){const t=s.level+"/"+s.region+"/"+s.name;let h=0x811c9dc5;for(const ch of t){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0;}return "s"+h.toString(36)+"_"+t.length;}
function rankStart(){if(RANK.on||!PUB||!(window.SR_FB&&window.SR_CLASS&&window.SR_CLASS.ok))return;RANK.on=true;
  SR_FB.ready().then(()=>{SR_FB.db.ref("gwrank").on("value",s=>{const d={};s.forEach(ch=>{d[ch.key]=ch.val();});RANK.data=d;RANK.ready=true;RANK.err=null;rankChanged();},e=>{RANK.err=e&&(e.code||e.message)||"오류";rankChanged();});}).catch(e=>{RANK.err="연결 안 됨";rankChanged();});}
function rankList(lv){return Object.entries(RANK.data).map(([k,v])=>Object.assign({key:k},v)).filter(v=>v&&v.level===lv&&typeof v.total==="number").sort((a,b)=>b.total-a.total||a.count-b.count||String(a.name).localeCompare(String(b.name)));}
function rankAdd(score){if(!S.school||!PUB||!window.SR_FB)return Promise.resolve(false);const sc=S.school,key=schoolKey(sc);
  return SR_FB.ready().then(()=>SR_FB.db.ref("gwrank/"+key).transaction(cur=>{cur=cur||{name:sc.name,region:sc.region,level:sc.level,total:0,count:0,best:0};
    cur.total=(cur.total||0)+score;cur.count=(cur.count||0)+1;cur.best=Math.max(cur.best||0,score);cur.name=sc.name;cur.region=sc.region;cur.level=sc.level;return cur;})).then(()=>true).catch(e=>{RANK.err=e&&(e.code||e.message)||"오류";rankChanged();return false;});}
let rankTab=null;
function rankHTML(lv,hud){if(!PUB)return '<p class="note">학교 순위는 학생들이 쓰는 공개 사이트에서 모두 함께 쌓여요.</p>';
  rankStart();lv=lv||(S.school&&S.school.level)||"중";if(!hud)rankTab=lv;
  const tabs='<div class="tabs">'+Object.keys(LEVELS).map(k=>'<button class="pbtn'+(k===lv?' on':'')+'" data-rt="'+k+'">'+LEVELS[k].bu+'</button>').join("")+'</div>';
  if(RANK.err)return tabs+'<p class="note">학교 순위를 불러오지 못했어요. ('+esc(RANK.err)+') 시험 점수는 이 기기에 저장돼요.</p>';
  if(!RANK.ready)return tabs+'<p class="note">학교 순위를 불러오는 중…</p>';
  const L=rankList(lv),mine=S.school&&S.school.level===lv?schoolKey(S.school):null,mi=mine?L.findIndex(x=>x.key===mine):-1;
  const row=(x,i)=>'<tr class="'+(x.key===mine?'me':'')+'"><td class="rk">'+(i<3?["🥇","🥈","🥉"][i]:(i+1))+'</td><td>'+esc(x.name)+' <span class="note">'+esc(x.region)+'</span></td><td class="num">'+x.total+'점</td><td class="num note">'+x.count+'회</td></tr>';
  let html=tabs+(L.length?'<table class="t rank"><tr><th>순위</th><th>학교</th><th class="num">누적</th><th class="num">응시</th></tr>'+L.slice(0,10).map(row).join("")+'</table>':'<p class="note">아직 '+LEVELS[lv].bu+'에 응시한 학교가 없어요. 첫 번째 학교가 되어 보세요!</p>');
  if(mine){html+=mi>=0?'<p class="myrank">우리 학교 <b>'+esc(S.school.name)+'</b> · 현재 <b>'+(mi+1)+'위</b> / '+L.length+'개 학교 · 누적 '+L[mi].total+'점</p>':'<p class="myrank">우리 학교 <b>'+esc(S.school.name)+'</b>는 아직 점수가 없어요. 시험을 보면 순위에 올라가요.</p>';}
  return html;}
function bindRank(){pBody.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{const box=$("rankBox");if(box){box.innerHTML=rankHTML(b.dataset.rt);bindRank();}});}
let hudTab=null,hudFold=false;
function renderRankHud(){const box=$("rankHud");if(!box||box.hidden)return;$("rankHudBody").innerHTML=rankHTML(hudTab,true);box.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{hudTab=b.dataset.rt;renderRankHud();});}
function showRankHud(on){const box=$("rankHud"),chip=$("rankChip");if(on){rankStart();hudTab=hudTab||(S.school&&S.school.level)||"중";box.hidden=hudFold;chip.hidden=!hudFold;renderRankHud();}else{box.hidden=true;chip.hidden=true;}}
function rankChanged(){renderRankHud();const box=$("rankBox");if(box&&!veil.hidden){box.innerHTML=rankHTML(rankTab);bindRank();}drawBangBoard();}

function schoolStep(step,st){st=st||{};
  if(step===1){setHead("과거 응시 · 학교 고르기","1 / 3 · 학교급을 골라요");
    h('<p>학교급에 맞는 수준의 문제가 나와요. 시험 점수는 우리 학교 점수에 차곡차곡 더해져 학교 순위가 정해져요.</p><div class="lvgrid">'+
      Object.keys(LEVELS).map(k=>'<button class="pbtn lv" data-lv="'+k+'"><b>'+LEVELS[k].k+'</b><small>'+({초:"한자 훈음 · 상형 · 한자어",중:"훈음 · 성어 · 구절 · 한시",고:"성어 · 구절 풀이 · 한시 읽기"}[k])+'</small></button>').join("")+'</div>');
    pBody.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>schoolStep(2,{level:b.dataset.lv}));return;}
  if(step===2){setHead("과거 응시 · 학교 고르기","2 / 3 · "+LEVELS[st.level].k+" · 지역을 골라요");
    h('<div class="rggrid">'+REGIONS.map(r=>'<button class="pbtn" data-rg="'+r+'">'+r+'</button>').join("")+'</div><div class="row"><button class="pbtn" id="back1">← 학교급 다시 고르기</button></div>');
    pBody.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>schoolStep(3,Object.assign(st,{region:b.dataset.rg})));$("back1").onclick=()=>schoolStep(1);return;}
  if(step===3){const lv=st.level,suf=LEVELS[lv].suf;setHead("과거 응시 · 학교 고르기","3 / 3 · "+st.region+" "+LEVELS[lv].k+" · 학교를 골라요");
    const known=(SCHOOLS[lv]&&SCHOOLS[lv][st.region])||[];
    h('<label for="schQ"><b>학교 이름 찾기</b></label><input type="text" id="schQ" placeholder="학교 이름 일부를 써 보세요 (예: 목포중앙)" autocomplete="off">'+
      '<div class="schlist" id="schList"></div><p class="note" id="schNote"></p>'+
      '<div class="row"><button class="pbtn" id="back2">← 지역 다시 고르기</button><button class="pbtn" id="schOwn">목록에 없어요 · 이 이름으로 등록</button></div>');
    const regd=()=>Object.values(RANK.data).filter(v=>v&&v.level===lv&&v.region===st.region).map(v=>v.name);
    const draw=()=>{const q=$("schQ").value.replace(/\s/g,"");const pool=[...new Set([...known,...regd()])].sort((a,b)=>a.localeCompare(b));
      const hits=(q?pool.filter(n=>n.replace(/\s/g,"").includes(q)):pool).slice(0,40);
      $("schList").innerHTML=hits.map(n=>'<button class="pbtn" data-sn="'+esc(n)+'">'+esc(n)+'</button>').join("");
      $("schNote").textContent=(hits.length?(q?hits.length+"곳 찾았어요":"전체 "+pool.length+"곳 · 이름 일부를 쓰면 좁혀져요"):"찾는 학교가 없어요. 이름을 확인하거나 '이 이름으로 등록'을 눌러요.");
      pBody.querySelectorAll("[data-sn]").forEach(b=>b.onclick=()=>chooseSchool({level:lv,region:st.region,name:b.dataset.sn}));};
    rankStart();$("schQ").addEventListener("input",draw);draw();$("schQ").focus();$("back2").onclick=()=>schoolStep(2,{level:lv});
    $("schOwn").onclick=()=>{let n=$("schQ").value.replace(/\s+/g,"").trim();if(n.length<2){$("schNote").textContent="학교 이름을 두 글자 이상 써 주세요.";$("schQ").focus();return;}
      if(BADW.test(n)){$("schNote").textContent="학교 이름을 바르게 써 주세요.";return;}
      n=n.replace(/(초등학교|초교|초|중학교|중|고등학교|고교|고)$/,"")+suf;if(n.length>20){$("schNote").textContent="이름이 너무 길어요.";return;}chooseSchool({level:lv,region:st.region,name:n});};}}
function chooseSchool(sc){S.school=sc;save();SFX.open();toast(sc.name+"(으)로 응시하네","점수는 우리 학교 점수에 더해져요");ROOMS.exam();}

  const s=Math.ceil(left/1000);$("exTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(left<=0){finishExam(true);return;}clearTimeout(EX.timer);EX.timer=setTimeout(examTimerTick,500);}
ROOMS.exam=function(){if(!S.school){schoolStep(1);return;}const sc=S.school,best=S.gw&&S.gw.best!=null?S.gw.best:null;const sj=SIJE[(kstDay())%SIJE.length];if(window.__drawExamBoard)window.__drawExamBoard(sj[0],"오늘의 시제 · "+sj[1]);

    '<p class="note">10 장원급제(홍패·어사화) · 9 갑과 · 7~8 을과 · 5~6 병과 · 4 이하 낙방'+(best!=null?' · 내 최고 '+best+'점':'')+'</p>'+

  if(G.pass)renderHongpae(G,score);

    setTimeout(()=>toast("장원급제로다! 어사화를 내리노라","갓에 어사화가 꽂혔어요"),300);}}
