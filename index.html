<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한문김선생의 온라인서당</title>
<meta name="description" content="명륜당에서 사자소학·명심보감을 익히고, 급수에 따라 옷이 바뀌는 3D 온라인 서당">
<meta property="og:title" content="한문김선생의 온라인서당">
<meta property="og:description" content="친구들과 함께 걸어 다니며 한문을 배우는 3D 서당 마을">
<meta name="theme-color" content="#2d5a86">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/fb-config.js"></script>
<script src="js/fb-shim.js"></script>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 걸어 다니는 3D 서당 마을 전체 화면 + 한지 HUD, 방에 들어가면 한지 두루마리 패널 (단일 톤, 가을 오후) */
:root{
  --ink:#2a231e; --ink-soft:#6a5d52;
  --hanji:#f6efe1; --hanji-deep:#ece1c9; --edge:#d6c5a2;
  --jjok:#2d5a86; --juchil:#b23a2c; --gold:#c8962e; --pine:#4f7a55;
  --sky:#cfe0ea;
  --display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;z-index:5}
.logo{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;
  background:var(--hanji);border:1px solid var(--edge);padding:6px 14px 6px 6px;border-radius:4px;box-shadow:0 2px 10px rgba(60,40,20,.14)}
.seal{width:34px;height:34px;background:var(--juchil);color:#fbefe3;font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:20px;border-radius:3px}
.logo b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.status{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 200px)}
.chip{background:var(--hanji);border:1px solid var(--edge);border-radius:3px;padding:7px 11px;font-size:14px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 10px rgba(60,40,20,.12);font-variant-numeric:tabular-nums}
.chip b{font-family:var(--display)}
.chip.people.off{opacity:.5}
.chip.grade{background:var(--jjok);color:#f6efe1;border-color:var(--jjok)}
button{font:inherit}
.chip.btn{cursor:pointer}
.help{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:12px;background:rgba(246,239,225,.82);padding:4px 10px;border-radius:2px;pointer-events:none}
.mini{top:calc(66px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:120px;height:218px;border:1px solid var(--edge);border-radius:3px;box-shadow:0 2px 10px rgba(60,40,20,.18);cursor:pointer}
@media (max-width:640px){.mini{display:none}}
.act{left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--juchil);color:#fbefe3;border:0;border-radius:3px;
  padding:12px 22px;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(120,30,20,.35);cursor:pointer;white-space:nowrap}
.act small{font-weight:400;opacity:.8;margin-left:8px;font-size:12px}
.where{left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--display);font-size:15px;background:rgba(246,239,225,.88);padding:4px 14px;border-radius:2px;pointer-events:none;white-space:nowrap}
.joy{left:max(24px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;
  background:rgba(246,239,225,.55);border:1px solid var(--edge);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--hanji);border:1px solid var(--edge);box-shadow:0 2px 8px rgba(60,40,20,.2)}
@media (hover:hover) and (pointer:fine){.joy{display:none}}
.act:focus-visible,.chip.btn:focus-visible,.pbtn:focus-visible,.x:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}

/* 패널 */
.veil{position:absolute;inset:0;z-index:8;background:rgba(40,28,18,.35);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.panel{width:min(620px,100%);max-height:100%;overflow:auto;background:var(--hanji);border:1px solid var(--edge);border-radius:4px;box-shadow:0 20px 60px rgba(40,28,18,.35);position:relative}
.panel header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--edge);background:var(--hanji-deep);position:sticky;top:0;z-index:1}
.panel header .ttl{font-family:var(--display);font-size:22px;font-weight:700}
.panel header .sub{font-size:13px;color:var(--ink-soft)}
.x{margin-left:auto;appearance:none;border:1px solid var(--edge);background:var(--hanji);border-radius:3px;padding:6px 12px;cursor:pointer}
.pb{padding:18px 20px 22px;display:grid;gap:14px}
.pb p{margin:0;line-height:1.65}
.big{font-family:var(--display);font-size:92px;line-height:1;text-align:center;color:var(--ink)}
.hun{text-align:center;font-family:var(--display);font-size:22px}
.note{font-size:13px;color:var(--ink-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{appearance:none;border:1px solid var(--edge);background:#fffaf0;border-radius:3px;padding:9px 14px;cursor:pointer;font-size:15px;color:var(--ink)}
.pbtn.main{background:var(--juchil);border-color:var(--juchil);color:#fbefe3;font-weight:700}
.pbtn.blue{background:var(--jjok);border-color:var(--jjok);color:#f6efe1}
.pbtn.on{background:var(--jjok);color:#f6efe1;border-color:var(--jjok)}
.pbtn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.verse{font-family:var(--display);font-size:34px;text-align:center;letter-spacing:.12em}
.eum{text-align:center;color:var(--jjok);font-size:17px;letter-spacing:.08em}
.words{display:flex;gap:6px;flex-wrap:wrap}
.word{background:#fffaf0;border:1px dashed var(--edge);border-radius:2px;padding:4px 10px;font-size:14px}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1px solid var(--edge);background:#fffdf7;border-radius:3px;padding:10px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fish{font-family:var(--display);font-size:40px;padding:14px 0}
.ok{color:var(--pine);font-weight:700}.ng{color:var(--juchil);font-weight:700}
.speech{background:#fffaf0;border:1px solid var(--edge);border-left:5px solid var(--jjok);border-radius:3px;padding:12px 14px;line-height:1.7;font-family:var(--display);font-size:16px}
.brushwrap{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1;background:#fbf6ea;border:1px solid var(--edge)}
.brushwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.album img{width:100%;aspect-ratio:1;background:#fbf6ea;border:1px solid var(--edge)}
.thought{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:8px 12px;font-size:14px}
.thought b{font-family:var(--display);color:var(--jjok);margin-right:6px}
.story{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:16px;min-height:96px;line-height:1.75}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:var(--edge)}.dots i.on{background:var(--juchil)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{border-bottom:1px solid var(--edge);padding:7px 6px;text-align:left}
.hanrow{display:grid;gap:10px;justify-items:center}
.hanline{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.hanline .sp{width:14px}
.hj{appearance:none;border:1px solid var(--edge);background:#fffaf0;border-radius:3px;padding:6px 3px 4px;min-width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font:inherit}
.hj:hover{border-color:var(--jjok)}.hj:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}
.hc{font-family:var(--display);font-size:30px;line-height:1.1}.hh{font-size:11px;color:var(--jjok);white-space:nowrap}
.pil{color:var(--juchil);font-family:var(--display);font-weight:700}.pbtn.on .pil{color:#ffd9cf}
.seal-big{display:inline-grid;place-items:center;width:46px;height:46px;border:3px solid var(--juchil);color:var(--juchil);font-family:var(--display);font-size:27px;font-weight:700;border-radius:4px;transform:rotate(-8deg)}
.minigrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.minigrid .pbtn{font-family:var(--display);font-size:20px;padding:6px 0}.minigrid .today{border:2px solid var(--juchil)}
.yj{background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:10px 14px}.yj summary{cursor:pointer}.yj ol{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;line-height:1.55;font-size:14px}
.pbtn.on:disabled{opacity:1}
@media (max-width:640px){.hj{min-width:44px}.hc{font-size:24px}.hh{font-size:10px}}
a.pbtn.lk{text-decoration:none;display:inline-block}
.gamerow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fffaf0;border:1px solid var(--edge);border-radius:3px;padding:10px 12px}
.gic{font-family:var(--display);font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:var(--juchil);color:#fbefe3;border-radius:3px}
@media (max-width:640px){.gamerow{grid-template-columns:auto 1fr}.gamerow .row{grid-column:1/-1}}
.moves{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.mv{appearance:none;width:74px;height:74px;border-radius:50%;border:1px solid var(--edge);background:rgba(246,239,225,.9);color:var(--ink);cursor:pointer;display:grid;place-content:center;gap:1px;box-shadow:0 3px 12px rgba(60,40,20,.2);touch-action:manipulation;font:inherit}
.mv .ei{font-size:30px;line-height:1}.mv b{font-family:var(--body);font-size:12px;font-weight:700}
.mv[aria-pressed="true"]{background:var(--jjok);border-color:var(--jjok);color:#f6efe1}
.mv:active{transform:scale(.94)}.mv:focus-visible{outline:2px solid var(--juchil);outline-offset:2px}
a.act{text-decoration:none;display:inline-block}
.entry{z-index:12;background:rgba(40,28,18,.5)}
.entry .panel{width:min(520px,100%)}
.enrow{display:grid;gap:8px}
.emogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.emo{appearance:none;aspect-ratio:1;border:1px solid var(--edge);background:#fffaf0;border-radius:50%;font-size:26px;cursor:pointer;display:grid;place-items:center;padding:0}
.emo[aria-checked="true"]{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,46,.3)}
.colgrid{display:flex;gap:10px;flex-wrap:wrap}
.col{appearance:none;width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.col[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--hanji) inset}
.emo:focus-visible,.col:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;color:#fff;font-weight:700;font-size:16px}
.pbtn.enter{width:100%;padding:13px;font-size:17px}
.toast{position:absolute;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translate(-50%,-50%) scale(.96);opacity:0;z-index:9;pointer-events:none;background:var(--hanji);border:1px solid var(--edge);border-left:6px solid var(--juchil);
  padding:14px 22px;border-radius:3px;font-family:var(--display);font-size:19px;box-shadow:0 10px 30px rgba(60,40,20,.25);transition:opacity .35s,transform .35s;max-width:calc(100% - 40px);text-align:center}
.toast small{display:block;font-family:var(--body);font-size:13px;color:var(--ink-soft);margin-top:4px}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:640px){
  .logo b{font-size:15px}.status{top:calc(62px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:none;justify-content:flex-start}
  .where{top:calc(108px + env(safe-area-inset-top,0px))}.help{display:none}.big{font-size:76px}.verse{font-size:26px}
  .act{bottom:calc(160px + env(safe-area-inset-bottom,0px))}.grid4{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div id="app">
  <canvas id="c" aria-label="걸어 다닐 수 있는 3D 서당 마을"></canvas>
  <div class="hud logo"><span class="seal">金</span><b>한문 김선생</b></div>
  <div class="hud status">
    <span class="chip people" id="peopleChip" hidden title="지금 서당에 있는 사람">👥 <b id="peopleN">1</b>명</span>
    <span class="chip grade" id="gradeChip"><b>학동</b></span>
    <span class="chip">익힘 <b id="doneN">0</b>/6</span>
    <span class="chip">붓 <b id="brushN">0</b></span>
    <button class="chip btn" id="gamesBtn">놀이</button>
    <button class="chip btn" id="mapBtn">지도</button>
    <button class="chip btn" id="albumBtn">서첩</button>
  </div>
  <div class="hud where" id="where">향교 밖</div>
  <canvas class="hud mini" id="mini" width="240" height="436" aria-label="향교 지도, 누르면 크게 보기"></canvas>
  <button class="hud act" id="act" hidden></button>
  <a class="hud act" id="actLink" href="#" target="_blank" rel="noopener" hidden></a>
  <div class="hud joy" id="joy" aria-hidden="true"><i id="knob"></i></div>
  <div class="hud help">방향키·WASD 걷기 · Shift 달리기 · Space 점프 · 화면 끌어 시점 돌리기 · E 들어가기</div>
  <div class="toast" id="toast" role="status"></div>
  <div class="hud moves">
    <button class="mv" id="runBtn" aria-pressed="false" title="달리기 (Shift)"><span class="ei" aria-hidden="true">🏃</span><b>달리기</b></button>
    <button class="mv" id="jumpBtn" title="점프 (Space)"><span class="ei" aria-hidden="true">🤸</span><b>점프</b></button>
  </div>
  <div class="veil entry" id="entry">
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="enTitle">
      <header><div><div class="ttl" id="enTitle">한문김선생의 온라인서당</div><div class="sub">친구들에게 보일 별명과 모습을 골라요. 진짜 이름은 안 써도 돼요.</div></div></header>
      <div class="pb">
        <div class="enrow"><label for="nick"><b>별명</b></label><div class="row" style="flex-wrap:nowrap"><input type="text" id="nick" maxlength="8" autocomplete="off" style="flex:1;min-width:0"><button class="pbtn" id="rollNick" type="button">다른 별명</button></div></div>
        <div class="enrow"><b>모습</b><div class="emogrid" id="emoGrid" role="radiogroup" aria-label="모습"></div></div>
        <div class="enrow"><b>이름표 색</b><div class="colgrid" id="colGrid" role="radiogroup" aria-label="이름표 색"></div></div>
        <div class="preview"><span class="tag" id="tagPrev"></span><span class="note" id="gradePrev"></span></div>
        <button class="pbtn main enter" id="enterBtn">입장하기</button>
      </div>
    </section>
  </div>
  <div class="veil" id="veil" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
      <header><div><div class="ttl" id="pTitle"></div><div class="sub" id="pSub"></div></div><button class="x" id="closeBtn">마을로</button></header>
      <div class="pb" id="pBody"></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

 {c:"人",hun:"사람 인",o:"서 있는 사람의 옆모습을 본떴어요.",w:["인간(人間)","거인(巨人)"]},

  d.firstChild.onclick=()=>{veil.hidden=true;$("entry").hidden=false;$("nick").value=S.nick||randNick();prev();$("nick").focus();};pBody.prepend(d);};

/* ================= 함께 접속 (공개 사이트에서만: Firebase 연결층이 있을 때) ================= */
const peerMap=new Map();let roomApi=null,lastPres=0,lastPresKey="",jumpCount=0;
const ENC={x:x=>x*0.72,z:z=>(z-13.5)*0.72,dx:x=>x/0.72,dz:z=>z/0.72+13.5};
function tagTexFor(nick,ava,col){const cv=document.createElement("canvas");cv.width=512;cv.height=128;const c=cv.getContext("2d");
  c.font="bold 50px 'Gowun Dodum',sans-serif";const label=(ava||"😀")+" "+(nick||"친구");const w=Math.min(500,c.measureText(label).width+56);const x=(512-w)/2;
  c.fillStyle=col||"#8a8f99";c.beginPath();if(c.roundRect)c.roundRect(x,22,w,84,42);else c.rect(x,22,w,84);c.fill();
  c.fillStyle="#fff";c.textAlign="center";c.textBaseline="middle";c.fillText(label,256,66,w-30);const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;return t;}
function peerGrade(v){const g=parseInt(String(v.rm||"g0").slice(1),10);return isFinite(g)?Math.max(0,Math.min(4,g)):0;}
function addPeer(id,v){const g=peerGrade(v);const body=buildChar(g);body.rotation.order="YXZ";scene.add(body);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tagTexFor(v.nick,v.ava,v.col),depthWrite:false,transparent:true}));sp.scale.set(2.4,0.6,1);scene.add(sp);
  const P={body,tag:sp,g,key:(v.nick||"")+(v.ava||"")+(v.col||""),x:ENC.dx(v.x||0),z:ENC.dz(v.z||0),yaw:v.yaw||0,jp:v.jp||0,jumpH:0,jumpV:0,walkT:0};
  body.position.set(P.x,heightAt(P.x,P.z),P.z);peerMap.set(id,P);return P;}
function updPeer(id,v){let P=peerMap.get(id);if(!P){addPeer(id,v);return;}
  const g=peerGrade(v);if(g!==P.g){const pos=P.body.position.clone(),r=P.body.rotation.y;scene.remove(P.body);P.body=buildChar(g);P.body.rotation.order="YXZ";P.body.position.copy(pos);P.body.rotation.y=r;scene.add(P.body);P.g=g;}
  const key=(v.nick||"")+(v.ava||"")+(v.col||"");if(key!==P.key){P.tag.material.map.dispose();P.tag.material.map=tagTexFor(v.nick,v.ava,v.col);P.tag.material.needsUpdate=true;P.key=key;}
  P.x=ENC.dx(v.x||0);P.z=ENC.dz(v.z||0);P.yaw=v.yaw||0;if((v.jp||0)!==P.jp){P.jp=v.jp||0;if(P.jumpH===0)P.jumpV=7.2;}}
function delPeer(id){const P=peerMap.get(id);if(!P)return;scene.remove(P.body);scene.remove(P.tag);P.tag.material.map.dispose();peerMap.delete(id);}
function setCount(){const el=$("peopleN");if(!el)return;el.textContent=peerMap.size+1;$("peopleChip").hidden=false;}
function startMulti(){if(roomApi||!(window.SR_CLASS&&window.SR_CLASS.ok&&window.claude&&window.claude.use))return;
  window.claude.use("room").then(r=>{if(!r)return;roomApi=r;
    r.onPeers(ch=>{(ch.left||[]).forEach(p=>delPeer(p.peer));[...(ch.joined||[]),...(ch.updated||[])].forEach(p=>{if(!p.isMe)updPeer(p.peer,p.presence||{});});setCount();});
    r.onConnection(ok=>{$("peopleChip").classList.toggle("off",!ok);});
    sendPresence(true);}).catch(e=>console.warn("함께 접속을 시작하지 못했어요",e));}
function sendPresence(force){if(!roomApi||!S.nick)return;const now=performance.now();
  const yaw=Math.atan2(Math.sin(player.rotation.y),Math.cos(player.rotation.y));
  const data={nick:S.nick.slice(0,8),ava:S.emoji,col:S.color,sty:"teen",fl:0,rm:"g"+S.grade,jp:jumpCount%1000,x:ENC.x(player.position.x),z:ENC.z(player.position.z),yaw};
  const key=[data.nick,data.ava,data.col,data.rm,data.jp,data.x.toFixed(1),data.z.toFixed(1),yaw.toFixed(1)].join("|");
  if(!force&&key===lastPresKey&&now-lastPres<4000)return;if(!force&&now-lastPres<250)return;
  lastPres=now;lastPresKey=key;roomApi.presence(data).catch(()=>{});}
function updatePeers(dt){peerMap.forEach(P=>{const b=P.body;const dx=P.x-b.position.x,dz=P.z-b.position.z,d=Math.hypot(dx,dz);
    if(d>12){b.position.x=P.x;b.position.z=P.z;}else{const k=Math.min(1,dt*8);b.position.x+=dx*k;b.position.z+=dz*k;}
    let dr=P.yaw-b.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));b.rotation.y+=dr*Math.min(1,dt*10);
    if(P.jumpH>0||P.jumpV>0){P.jumpV-=22*dt;P.jumpH+=P.jumpV*dt;if(P.jumpH<=0){P.jumpH=0;P.jumpV=0;}}
    const moving=d>0.05;P.walkT=moving?P.walkT+dt*10:P.walkT*0.9;
    b.position.y=heightAt(b.position.x,b.position.z)+(P.jumpH>0?P.jumpH:(moving?Math.abs(Math.sin(P.walkT))*0.06:0));
    const a=b.userData.arms;if(a){const sw=P.jumpH>0?-0.9:(moving?Math.sin(P.walkT)*0.5:0);a[0].rotation.x=-0.38+sw;a[1].rotation.x=-0.38-sw;}
    P.tag.position.set(b.position.x,b.position.y+(P.g>=4?3.05:2.55),b.position.z);});}
/* ================= 루프 ================= */
let near=null;
function resize(){const w=canvas.clientWidth,hgt=canvas.clientHeight;renderer.setSize(w,hgt,false);camera.aspect=w/hgt;camera.fov=w/hgt<0.8?64:50;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();hud();
const clock=new THREE.Clock();const tmp=new THREE.Vector3();let walkT=0;
const ZONES=[{n:"마음정비소 푯말 앞",x:4.3,z:62.4,r:2.2},{n:"홍살문 앞",x:0,z:57,r:7},{n:"외삼문",x:0,z:46,r:3.5},{n:"은행나무 아래",x:-6,z:1.5,r:5},{n:"명륜당 앞",x:0,z:-4,r:4.5},{n:"동재 앞",x:9.5,z:6,r:4},{n:"서재 앞",x:-9.5,z:6,r:4},{n:"비천당 앞",x:-11.5,z:30,r:4.5},{n:"다국어 반 앞",x:14,z:30,r:4},{n:"한자 놀이 마당",x:12,z:20.5,r:8.5},{n:"한자 놀이 마당",x:-10,z:20.5,r:7},{n:"반수 연못가",x:10,z:41,r:5.5},{n:"놀이 마당",x:-9,z:40,r:4},{n:"훈장님 방 앞",x:-15,z:-12,r:4},{n:"존경각 앞",x:15,z:-12,r:4},{n:"내삼문",x:0,z:-25,r:3},{n:"대성전 뜰",x:0,z:-30,r:6}];
function zoneName(p){for(const z of ZONES)if(Math.hypot(p.x-z.x,p.z-z.z)<z.r)return z.n;if(p.z>46.6)return "향교 밖";if(p.z<-22)return "제향 구역";return "강학 구역";}
let lastZone="";
function loop(now){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  // 이동
  let ix=0,iz=0;
  if(jumpH>0||jumpV>0){jumpV-=22*dt;jumpH+=jumpV*dt;if(jumpH<=0){jumpH=0;jumpV=0;}}
  if(!panelOpen&&!spin&&!bow){if(keys["w"]||keys["arrowup"])iz+=1;if(keys["s"]||keys["arrowdown"])iz-=1;if(keys["a"]||keys["arrowleft"])ix-=1;if(keys["d"]||keys["arrowright"])ix+=1;ix+=jv.x;iz-=jv.y;}
  const L=Math.hypot(ix,iz);
  if(L>0.05){const running=keys["shift"]||runOn;const sp=(running?10:5.4)*Math.min(1,L);const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    let vx=(fx*iz+rx*ix)/Math.max(1,L),vz=(fz*iz+rz*ix)/Math.max(1,L);
    let nx=player.position.x+vx*sp*dt,nz=player.position.z+vz*sp*dt;
    colliders.forEach(c=>{const dx=nx-c.x,dz=nz-c.z,d=Math.hypot(dx,dz),m=c.r+0.35;if(d<m&&d>0.0001){nx=c.x+dx/d*m;nz=c.z+dz/d*m;}});
    boxes.forEach(b=>{const m=0.35;if(nx>b.x0-m&&nx<b.x1+m&&nz>b.z0-m&&nz<b.z1+m){const dl=nx-(b.x0-m),dr=(b.x1+m)-nx,db=nz-(b.z0-m),df=(b.z1+m)-nz,mn=Math.min(dl,dr,db,df);
      if(mn===dl)nx=b.x0-m;else if(mn===dr)nx=b.x1+m;else if(mn===db)nz=b.z0-m;else nz=b.z1+m;}});
    nx=Math.max(-44,Math.min(44,nx));nz=Math.max(-47,Math.min(74,nz));
    const oz=player.position.z;player.position.x=nx;player.position.z=nz;
    GATES.forEach(G=>{if(Math.abs(nx-G.x)>G.w/2)return;
      if(oz>G.z&&nz<=G.z)toast(nx>G.x?"오른쪽 문으로 바르게 들어왔구나":"들어갈 때는 오른쪽(동쪽) 문이니라",nx>G.x?"들어갈 땐 오른쪽, 나올 땐 왼쪽 · 東入西出":"가운데는 신문(神門)이라 닫혀 있고, 왼쪽은 나가는 문이에요");
      else if(oz<G.z&&nz>=G.z)toast(nx<G.x?"왼쪽 문으로 바르게 나왔구나":"나갈 때는 왼쪽(서쪽) 문이니라","東入西出 · 동쪽으로 들고 서쪽으로 나요");});
    const target=Math.atan2(vx,vz);let dr=target-player.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));player.rotation.y+=dr*Math.min(1,dt*10);
    walkT+=dt*(running?14:9)*Math.min(1,L);
  }else walkT*=0.9;
  const arms=player.userData.arms;
  if(spin){const p=Math.min(1,(now-spin.t0)/1400);const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.rotation.y=spin.base+e*Math.PI*4;player.position.y=heightAt(player.position.x,player.position.z)+Math.sin(p*Math.PI)*0.7;
    if(p>=0.5&&!spin.done){spin.done=true;spin.doSwap();burst();}
    if(p>=1){player.rotation.y=spin.base;player.position.y=heightAt(player.position.x,player.position.z);toast("축하하네! 이제 "+GRADES[spin.next].k+"("+GRADES[spin.next].h+")이로다","옷차림이 바뀌었어요");spin=null;}}
  else if(bow){const p=Math.min(1,(now-bow.t0)/2600);const lean=Math.sin(p*Math.PI);player.position.y=heightAt(player.position.x,player.position.z)-lean*0.12;player.rotation.x=lean*0.42;
    if(arms){arms[0].rotation.x=-0.38-lean*0.9;arms[1].rotation.x=-0.38-lean*0.9;}
    if(p>=1){player.rotation.x=0;toast("정성이 닿았느니라",bow.saved?"다짐을 서첩에 담았어요 · 붓 +1":"향 연기가 하늘로 올라가요");bow=null;}}
  else{player.position.y=heightAt(player.position.x,player.position.z)+(jumpH>0?jumpH:(L>0.05?Math.abs(Math.sin(walkT))*(keys["shift"]||runOn?0.1:0.06):0));
    if(arms){const sw=jumpH>0?-0.9:(L>0.05?Math.sin(walkT)*((keys["shift"]||runOn)?0.75:0.45):Math.sin(t*1.6)*0.04);player.userData.arms[0].rotation.x=-0.38+sw;player.userData.arms[1].rotation.x=-0.38-sw;}}
  // 근처 확인
  let nb=null,nd=2.4;spots.forEach(s=>{const d=Math.hypot(player.position.x-s.x,player.position.z-s.z);if(d<nd){nd=d;nb=s;}});
  if(nb!==near){near=nb;const a=$("act"),al=$("actLink");a.hidden=true;al.hidden=true;if(near){const el=near.url?al:a;if(near.url){al.href=near.url;al.target=(PUB&&!near.ext)?"_self":"_blank";}el.hidden=false;el.innerHTML=near.act+" · "+near.name+'<small>E</small>';}}
  const zn=zoneName(player.position);if(zn!==lastZone){lastZone=zn;$("where").textContent=zn;}
  // 카메라
  const tx=player.position.x,tz=player.position.z;
  const ty=player.position.y;let cd=dist;
  const inside=(x,z,y)=>boxes.some(b=>x>b.x0-0.3&&x<b.x1+0.3&&z>b.z0-0.3&&z<b.z1+0.3&&y<7);
  for(let d=0.5;d<=dist;d+=0.4){const cx=tx+Math.sin(yaw)*d*Math.cos(pitch),cz=tz+Math.cos(yaw)*d*Math.cos(pitch),cy=ty+1.3+d*Math.sin(pitch);if(inside(cx,cz,cy-heightAt(cx,cz))){cd=Math.max(1.6,d-0.4);break;}}
  tmp.set(tx+Math.sin(yaw)*cd*Math.cos(pitch),ty+1.3+cd*Math.sin(pitch),tz+Math.cos(yaw)*cd*Math.cos(pitch));
  camera.position.lerp(tmp,Math.min(1,dt*6));camera.lookAt(tx,ty+1.3,tz);
  sun.position.set(tx+14,22,tz+10);sun.target.position.set(tx,0,tz);sun.target.updateMatrixWorld();
  // 장식 움직임
  if(!reduce){leaves.forEach(l=>{const u=l.userData;l.position.y-=u.vy*dt;l.position.x+=Math.sin(t*u.sp+u.ph)*0.4*dt;l.rotation.x+=dt*u.sp;l.rotation.z+=dt*0.7;if(l.position.y<heightAt(l.position.x,l.position.z)+0.02||Math.abs(l.position.x-player.position.x)>20||Math.abs(l.position.z-player.position.z)>20)resetLeaf(l,false);});
    friends.forEach((f,i)=>{f.position.y=f.userData.by+Math.abs(Math.sin(t*2+i))*0.02;});npc.rotation.z=Math.sin(t*0.8)*0.01;}
  for(let i=confetti.length-1;i>=0;i--){const m=confetti[i],u=m.userData;u.v.y-=6*dt;u.v.multiplyScalar(0.985);m.position.addScaledVector(u.v,dt);m.rotation.x+=u.r.x*dt;m.rotation.y+=u.r.y*dt;u.life-=dt;
    if(m.position.y<0.05){m.position.y=0.05;u.v.set(0,0,0);u.r.set(0,0,0);}if(u.life<=0){scene.remove(m);confetti.splice(i,1);}}
  flames.forEach((f,i)=>{f.scale.y=1+Math.sin(t*13+i*2)*0.18;});
  if(!reduce)gameAnim.forEach(f=>f(t));
  updateSmoke(dt);
  if((++frameN)%3===0)drawMini();
  updatePeers(dt);sendPresence(false);
  nameTag.position.set(player.position.x,player.position.y+(S.grade>=4?3.05:2.55),player.position.z);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
camera.position.set(0,6,73);
requestAnimationFrame(loop);

})();
