<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style>
.home-btn{position:relative;z-index:60;flex:none;display:inline-flex;align-items:center;gap:4px;background:#c23b2c;color:#fff!important;text-decoration:none;font:700 14px "Gowun Dodum","Apple SD Gothic Neo",sans-serif;padding:8px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.home-btn:focus-visible{outline:2px solid #e3b04b;outline-offset:2px}
header.top .kim{margin-right:auto}
@media (max-width:480px){header.top .kim small{display:none}header.top .kim b{font-size:14px}header.top .stats{gap:8px}.home-btn{padding:7px 10px;font-size:13px}}
</style></head><body>
<title>부수 블록 쌓기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@700;900&family=Gowun+Dodum&display=swap">
<style>
/* 배치: 한 화면 — 간판줄, 왼쪽 네 줄 블록 판 + 오른쪽 다음 블록·방금 만든 글자, 아래 조작 버튼 */
:root{--bg:#10151b;--panel:#18202a;--line:#2b3644;--paper:#eef2f5;--muted:#8d9aa8;--seal:#d0483a;--gold:#e8b84a;--jade:#4fb38a;
--han:"Noto Serif KR","Batang",serif;--pop:"Black Han Sans","Noto Sans KR",sans-serif;--body:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--paper);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kim{display:flex;align-items:center;gap:8px}
.kim i{font-style:normal;width:36px;height:36px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--han);font-weight:900;font-size:21px;border-radius:3px;transform:rotate(-4deg);flex:none}
.kim b{font-family:var(--han);font-weight:900;font-size:17px;line-height:1.15;display:block}
.kim small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.stats{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums}
.stat{text-align:right}.stat b{display:block;font-family:var(--pop);font-weight:400;font-size:21px;color:var(--gold);line-height:1}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.1em}
.icon{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--paper);font-size:15px;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(96px,150px);gap:10px}
.stage{position:relative;min-height:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.box span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.box .nx{font-family:var(--han);font-weight:900;font-size:40px;line-height:1.1;color:var(--jade)}
.box .made{font-family:var(--han);font-weight:900;font-size:46px;line-height:1.1;color:var(--gold)}
.box p{margin:0;font-size:13px;line-height:1.45}
.col{flex:1;min-height:0;overflow:auto}
.col .grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.col .grid b{font-family:var(--han);font-size:20px;width:30px;height:30px;display:grid;place-items:center;background:#202a35;border-radius:5px}
.ctrl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.ctrl button{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--paper);font-size:18px;font-family:var(--body);font-weight:700;cursor:pointer}
.ctrl button.drop{background:var(--jade);border-color:var(--jade);color:#0c1a14}
.over{position:absolute;inset:0;background:rgba(16,21,27,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;overflow:auto}
.over h2{margin:0;font-family:var(--pop);font-weight:400;font-size:clamp(28px,7vw,42px);color:var(--gold)}
.over p{margin:0;max-width:36ch;line-height:1.6;font-size:14px}
.btn{padding:11px 22px;border-radius:8px;border:0;background:var(--seal);color:#fff;font-family:var(--body);font-weight:700;font-size:16px;cursor:pointer}
@media (max-width:420px){.main{grid-template-columns:1fr 96px}.box .nx{font-size:32px}.box .made{font-size:36px}}
</style>

<div class="app">
  <header class="top">
    <a class="home-btn" href="../?from=g6" aria-label="서당 마을로 돌아가기">← 마을로</a>
    <div class="kim"><i>金</i><div><b>한문 김선생</b><small>부수 블록 쌓기</small></div></div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>점수</span></div>
      <div class="stat"><b id="made">0</b><span>만든 글자</span></div>
      <div class="stat"><b id="best">0</b><span>최고</span></div>
      <button class="icon" id="mute" aria-label="소리 끄기">🔊</button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="블록 판. 떨어지는 부수를 알맞은 글자 위에 놓으세요"></canvas>
      <div class="over" id="over">
        <h2 id="oTitle">부수 블록 쌓기</h2>
        <p id="oText">위에서 부수(氵·木·亻·日·言·忄)가 떨어져요. 짝이 맞는 글자 위에 떨어뜨리면 氵+每=海처럼 새 글자가 되어 사라져요. 짝이 틀리면 돌무더기가 쌓여요. 맨 위까지 차면 끝!</p>
        <p style="color:var(--muted)">키보드 ← → 이동 · ↓ 빨리 · 스페이스 바로 떨어뜨리기<br>화면의 줄을 누르면 그 줄로 옮겨요</p>
        <button class="btn" id="start">시작하기</button>
      </div>
    </div>
    <aside class="side">
      <div class="box"><span>다음 부수</span><div class="nx" id="nx">—</div><p id="nxh"></p></div>
      <div class="box"><span>방금 만든 글자</span><div class="made" id="mc">—</div><p id="mh">짝을 맞춰 보세요</p></div>
      <div class="box col"><span>만든 글자 모음</span><div class="grid" id="coll"></div></div>
    </aside>
  </div>
  <div class="ctrl"><button id="bl" aria-label="왼쪽으로">◀</button><button id="bd" class="drop" aria-label="바로 떨어뜨리기">▼ 내리기</button><button id="br" aria-label="오른쪽으로">▶</button></div>
</div>

<script>
(()=>{
const RAD={"氵":"물 수","木":"나무 목","亻":"사람 인","日":"날 일","言":"말씀 언","忄":"마음 심"};
const M={
 "氵":{"每":["海","바다 해"],"靑":["淸","맑을 청"],"主":["注","부을 주"],"可":["河","물 하"],"工":["江","강 강"]},
 "木":{"主":["柱","기둥 주"],"交":["校","학교 교"],"公":["松","소나무 송"],"寸":["村","마을 촌"]},
 "亻":{"主":["住","살 주"],"可":["何","어찌 하"],"立":["位","자리 위"],"寸":["付","줄 부"]},
 "日":{"靑":["晴","갤 청"],"寺":["時","때 시"],"生":["星","별 성"]},
 "言":{"靑":["請","청할 청"],"寺":["詩","시 시"],"十":["計","셀 계"],"寸":["討","칠 토"]},
 "忄":{"靑":["情","뜻 정"],"亡":["忙","바쁠 망"],"生":["性","성품 성"]}
};
const BASES=["每","靑","主","可","工","交","公","寸","立","寺","生","十","亡"];
const COLS=4,ROWS=8;
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
const HAN='"Noto Serif KR","Batang",serif',POP='"Black Han Sans","Noto Sans KR",sans-serif';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0;function resize(){const d=Math.min(devicePixelRatio||1,2),r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(stage);resize();
let AC=null,muted=false,NB=null;
function A(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function nb(a){if(!NB){NB=a.createBuffer(1,a.sampleRate*.6,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function noise(dur,type,f,q,v,dl=0){const a=A();if(!a||muted)return;const t=a.currentTime+dl,n=a.createBufferSource();n.buffer=nb(a);const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(fl).connect(g).connect(a.destination);n.start(t);n.stop(t+dur+.05)}
function tone(f0,f1,dur,type,v,dl=0){const a=A();if(!a||muted)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
const move=()=>tone(700,0,.04,'square',.04);
const thunk=()=>{tone(140,60,.18,'sine',.5);noise(.08,'lowpass',500,.7,.5)};
const merge=c=>{const b=[523.25,659.25,783.99,1046.5];b.slice(0,2+Math.min(c,2)).forEach((f,i)=>tone(f,0,.5,'triangle',.14,i*.06));noise(.3,'highpass',4000,.5,.15)};
const over=()=>{[392,330,262,196].forEach((f,i)=>tone(f,0,.4,'triangle',.15,i*.15))};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기')};
let best=0;try{best=+localStorage.getItem('blocks-best')||0}catch(e){}$('best').textContent=best;

let state='ready',cols=[],piece=null,nextR=null,score=0,made=0,combo=0,speed=1.3,soft=false,fx=[],pops=[],shake=0;
const collected=new Set();
const randBase=()=>BASES[Math.floor(Math.random()*BASES.length)];
function pickRad(){if(Math.random()<.72){const opts=[];cols.forEach(c=>{for(const r in M)if(M[r][c.base])opts.push(r)});if(opts.length)return opts[Math.floor(Math.random()*opts.length)]}
  const ks=Object.keys(RAD);return ks[Math.floor(Math.random()*ks.length)]}
function start(){A();state='play';score=0;made=0;combo=0;speed=1.3;collected.clear();$('coll').innerHTML='';
  cols=Array.from({length:COLS},()=>({base:randBase(),junk:[]}));
  // 처음에는 적어도 하나는 짝이 되게
  nextR=pickRad();spawn();$('over').hidden=true;upd()}
$('start').onclick=start;
function spawn(){piece={r:nextR,c:Math.floor(COLS/2)-(Math.random()<.5?1:0),y:-1};nextR=pickRad();$('nx').textContent=nextR;$('nxh').textContent=RAD[nextR];
  if(cols[piece.c].junk.length+1>=ROWS)gameOver()}
function upd(){$('score').textContent=score;$('made').textContent=made}
function geom(){const cw=Math.min(W/COLS,(H-8)/ROWS),bw=cw*COLS,ox=(W-bw)/2,floor=H-4;return{cw,ox,floor}}
function landRow(c){return cols[c].junk.length+1} // 조각이 놓일 줄(바닥 0)
function step(dir){if(state!=='play'||!piece)return;const n=piece.c+dir;if(n<0||n>=COLS)return;
  const g=geom();const pyB=(piece.y+1);const rowTopNeeded=ROWS-landRow(n);if(pyB>rowTopNeeded)return;piece.c=n;move()}
function moveTo(c){if(!piece)return;while(piece.c!==c){const before=piece.c;step(c>piece.c?1:-1);if(piece.c===before)break}}
function hardDrop(){if(state!=='play'||!piece)return;piece.y=ROWS-landRow(piece.c)-1;land()}
function land(){const c=cols[piece.c],r=piece.r,res=M[r]&&M[r][c.base];const g=geom(),x=g.ox+piece.c*g.cw+g.cw/2,y=g.floor-(c.junk.length+.5)*g.cw;
  if(res){combo++;made++;const gain=10+combo*5;score+=gain;merge(combo);shake=5;
    fx.push({x,y,t:0,c:res[0]});pops.push({x,y:y-g.cw*.6,t:0,txt:`${r}+${c.base}=${res[0]}`});
    $('mc').textContent=res[0];$('mh').textContent=`${res[1]} (${r}+${c.base})`;
    if(!collected.has(res[0])){collected.add(res[0]);const b=document.createElement('b');b.textContent=res[0];b.title=res[1];$('coll').appendChild(b)}
    if(c.junk.length)c.junk.pop();c.base=randBase();speed=Math.min(4,1.3+made*.09);try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}}
  else{combo=0;c.junk.push(r);thunk();shake=3;pops.push({x,y:y-g.cw*.6,t:0,txt:`${r}+${c.base} ✗`,bad:1});try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  upd();piece=null;if(cols.some(k=>k.junk.length+1>=ROWS)){gameOver();return}setTimeout(()=>{if(state==='play')spawn()},250)}
function gameOver(){state='over';piece=null;over();if(score>best){best=score;try{localStorage.setItem('blocks-best',best)}catch(e){}$('best').textContent=best}
  $('oTitle').textContent=`${score}점 · ${made}글자`;$('oText').textContent=`만든 글자: ${[...collected].join(' ')||'아직 없어요'}. 짝이 되는 부수와 글자를 떠올리며 다시 도전해 보세요.`;$('start').textContent='다시 하기';$('over').hidden=false}
addEventListener('keydown',e=>{if(state!=='play')return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}else if(e.key==='ArrowRight'){e.preventDefault();step(1)}else if(e.key==='ArrowDown'){e.preventDefault();soft=true}else if(e.key===' '){e.preventDefault();hardDrop()}});
addEventListener('keyup',e=>{if(e.key==='ArrowDown')soft=false});
$('bl').onclick=()=>{A();step(-1)};$('br').onclick=()=>{A();step(1)};$('bd').onclick=()=>{A();hardDrop()};
cv.addEventListener('pointerdown',e=>{A();if(state!=='play')return;const r=cv.getBoundingClientRect(),g=geom(),c=Math.floor((e.clientX-r.left-g.ox)/g.cw);if(c>=0&&c<COLS){if(piece&&c===piece.c)hardDrop();else moveTo(c)}});

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function block(x,y,s,txt,kind){const p=s*.06;rr(x+p,y+p,s-p*2,s-p*2,s*.12);
  const col=kind==='rad'?['#5fd0a2','#2f8a66']:kind==='junk'?['#56606b','#3a424b']:['#f1e4c4','#cdb889'];
  const g=ctx.createLinearGradient(0,y,0,y+s);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.22)';rr(x+p*2,y+p*2,s-p*4,s*.12,s*.06);ctx.fill();
  ctx.font=`900 ${s*.6}px ${HAN}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=kind==='junk'?'rgba(238,242,245,.35)':kind==='rad'?'#0c1a14':'#2a1d0d';ctx.fillText(txt,x+s/2,y+s*.54)}
let last=performance.now();
function frame(now){const dt=Math.min(2.5,(now-last)/16.67);last=now;shake*=Math.pow(.8,dt);
  const g=geom();ctx.save();if(!reduce&&shake>.3)ctx.translate((Math.random()-.5)*shake,0);
  ctx.fillStyle='#0d1217';ctx.fillRect(-10,0,W+20,H);
  for(let c=0;c<COLS;c++){ctx.fillStyle=c%2?'rgba(255,255,255,.025)':'rgba(255,255,255,.045)';ctx.fillRect(g.ox+c*g.cw,0,g.cw,H)}
  ctx.strokeStyle='rgba(208,72,58,.5)';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(g.ox,g.floor-(ROWS-1)*g.cw);ctx.lineTo(g.ox+COLS*g.cw,g.floor-(ROWS-1)*g.cw);ctx.stroke();ctx.setLineDash([]);
  if(cols.length)cols.forEach((col,c)=>{const x=g.ox+c*g.cw;col.junk.forEach((j,k)=>block(x,g.floor-(k+1)*g.cw,g.cw,j,'junk'));block(x,g.floor-(col.junk.length+1)*g.cw,g.cw,col.base,'base');
    if(piece&&piece.c===c){ctx.fillStyle='rgba(95,208,162,.08)';ctx.fillRect(x,0,g.cw,g.floor-(col.junk.length+1)*g.cw)}});
  if(state==='play'&&piece){const stop=ROWS-landRow(piece.c)-1;piece.y+=(soft?speed*7:speed)*dt/60;
    if(piece.y>=stop){piece.y=stop;block(g.ox+piece.c*g.cw,g.floor-(ROWS-piece.y)*g.cw,g.cw,piece.r,'rad');land()}
    else{const gy=g.floor-(ROWS-stop)*g.cw;ctx.strokeStyle='rgba(95,208,162,.4)';ctx.setLineDash([4,4]);rr(g.ox+piece.c*g.cw+4,gy+4,g.cw-8,g.cw-8,8);ctx.stroke();ctx.setLineDash([]);
      block(g.ox+piece.c*g.cw,g.floor-(ROWS-piece.y)*g.cw,g.cw,piece.r,'rad')}}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt/50;if(f.t>=1){fx.splice(i,1);continue}const s=g.cw*(1+f.t*.8);
    ctx.save();ctx.globalAlpha=1-f.t;const gl=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,s);gl.addColorStop(0,'rgba(232,184,74,.7)');gl.addColorStop(1,'rgba(232,184,74,0)');ctx.fillStyle=gl;ctx.fillRect(f.x-s,f.y-s,s*2,s*2);
    ctx.font=`900 ${g.cw*.9*(1+f.t*.3)}px ${HAN}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffe6a6';ctx.fillText(f.c,f.x,f.y-f.t*g.cw*.6);ctx.restore()}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=dt/55;if(p.t>=1){pops.splice(i,1);continue}ctx.save();ctx.translate(p.x,p.y-p.t*40);ctx.globalAlpha=1-p.t;ctx.font=`${Math.max(15,g.cw*.24)}px ${POP}`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#0d1217';ctx.strokeText(p.txt,0,0);ctx.fillStyle=p.bad?'#ff9a8c':'#e8b84a';ctx.fillText(p.txt,0,0);ctx.restore()}
  ctx.restore();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>

</body></html>
