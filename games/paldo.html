<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팔도한자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 팔도한자: 맑은 바다색 바탕 위에 흰 땅, 떠 있는 유리 패널.
     먹색(글자)·주홍 도장(브랜드·주요 버튼)·파랑(지금 문제)·초록(맞힘).
     화면 전체가 지도, 위에 머리줄, 아래에 문제 카드. */
  --sea1:#e6eff7; --sea2:#f5f8fc; --dot:rgba(22,33,62,.06);
  --bg:#f3f6fa; --soft:#eef3f8;
  --card:#ffffff; --glass:rgba(255,255,255,.84);
  --ink:#16213e; --muted:#6a778c; --line:#e1e7ef; --line2:#c9d3df;
  --land:#ffffff; --land-dim:#f1f4f8; --land-lock:#e2e8ef; --land-clear:#e2f5ec;
  --border:#2b3a55; --border-thin:#cdd6e1;
  --blue:#2f6bff; --green:#10a36b; --green-ink:#0b7a50; --red:#e5432a; --red2:#ff7a45; --gold:#f2a900;
  --shadow:0 10px 30px rgba(22,33,62,.10),0 2px 6px rgba(22,33,62,.05);
  --shadow-lg:0 24px 60px rgba(22,33,62,.18),0 4px 12px rgba(22,33,62,.06);
  --display:"Noto Serif KR","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hanja:"Noto Serif KR","Nanum Myeongjo",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea1:#0e1524; --sea2:#131b2d; --dot:rgba(255,255,255,.04);
  --bg:#1c2538; --soft:#222c42; --card:#1a2335; --glass:rgba(26,35,53,.84);
  --ink:#e8edf7; --muted:#98a4b9; --line:#2a3550; --line2:#3a4764;
  --land:#27324b; --land-dim:#1f2940; --land-lock:#172033; --land-clear:#173a31;
  --border:#c4cee2; --border-thin:#3a4766;
  --blue:#6f9bff; --green:#34d399; --green-ink:#6ee7b7; --red:#ff6b55; --red2:#ff9a6b; --gold:#ffcc4d;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sea1:#0e1524; --sea2:#131b2d; --dot:rgba(255,255,255,.04);
  --bg:#1c2538; --soft:#222c42; --card:#1a2335; --glass:rgba(26,35,53,.84);
  --ink:#e8edf7; --muted:#98a4b9; --line:#2a3550; --line2:#3a4764;
  --land:#27324b; --land-dim:#1f2940; --land-lock:#172033; --land-clear:#173a31;
  --border:#c4cee2; --border-thin:#3a4766;
  --blue:#6f9bff; --green:#34d399; --green-ink:#6ee7b7; --red:#ff6b55; --red2:#ff9a6b; --gold:#ffcc4d;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background-color:var(--sea2);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px),linear-gradient(180deg,var(--sea1),var(--sea2) 70%);background-size:22px 22px,100% 100%;
  color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.drag{cursor:grabbing}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
/* 지도 */
.mun{fill:var(--land-lock);stroke:var(--border-thin);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .5s}
.bgm{fill:var(--land-lock);stroke:var(--border-thin);stroke-width:.4;vector-effect:non-scaling-stroke}
.reg.open .mun{fill:var(--land-dim)}
.reg.clear .mun{fill:var(--land-clear)}
.reg.on .mun{fill:var(--land)}
.reg.open,.reg.clear{cursor:pointer}
.reg.open:hover .mun{fill:var(--land)}
#map.home .reg.open .mun{fill:var(--land)}
#map.home .reg.open:hover .mun{fill:color-mix(in srgb,var(--blue) 8%,var(--land))}
#map:not(.home) .reg:not(.on) .mun{fill:var(--land-lock)}
.pin.off{opacity:.4}
.out{fill:none;stroke:var(--border);stroke-width:1.2;stroke-opacity:.75;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.out.lock{stroke:var(--border-thin);stroke-opacity:1}
#route{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-dasharray:1 7;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.6}
.rname{font-family:var(--body);font-weight:700;font-size:15px;letter-spacing:-.01em;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.rname.lock{fill:var(--muted)}
.rname tspan{font-weight:500;font-size:11.5px;fill:var(--muted)}
.seal{font-family:var(--hanja);font-weight:900;font-size:19px;fill:var(--red);text-anchor:middle;pointer-events:none}
.sealc{fill:color-mix(in srgb,var(--card) 80%,transparent);stroke:var(--red);stroke-width:2.2;pointer-events:none}
.pin{cursor:pointer}
.pin .body{filter:drop-shadow(0 2px 3px rgba(22,33,62,.22))}
.pin .dot{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.pin .ico{color:var(--ink)}
.pin .lab{font-family:var(--hanja);font-weight:900;font-size:15px;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4.5px;stroke-linejoin:round}
.pin.done .dot{fill:var(--green);stroke:var(--card);stroke-width:2}
.pin.done .ico{color:#fff}
.pin.done .lab{font-family:var(--body);font-weight:700;font-size:15px;fill:var(--green-ink)}
.pin.cur .dot{fill:var(--blue);stroke:var(--card);stroke-width:2.5}
.pin.cur .ico{color:#fff}
.pin.cur .lab{fill:var(--blue);font-size:19px}
.pin .halo{fill:var(--blue);opacity:0}
.pin.cur .halo{animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{r:14px;opacity:.32}100%{r:46px;opacity:0}}
.pin.pop .body{animation:pinpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pinpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
#hero{pointer-events:none}
/* 공통 유리 패널 */
.pill{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px 14px;font-weight:600;white-space:nowrap}
button.pill{transition:transform .15s,border-color .15s}
button.pill:hover{border-color:var(--line2);transform:translateY(-1px)}
/* 머리줄 */
.top{position:fixed;left:12px;right:12px;top:12px;z-index:5;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand tabs right" "sub sub sub";gap:10px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.brand{grid-area:brand;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:16px}
.brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--red),var(--red2));color:#fff;display:grid;place-items:center;font-family:var(--hanja);font-weight:900;font-size:21px;transform:rotate(-5deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3),0 4px 10px color-mix(in srgb,var(--red) 35%,transparent)}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.15}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.tabrow{grid-area:tabs;display:flex;justify-content:center;min-width:0}
.seg{display:flex;gap:2px;padding:4px;border-radius:14px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:600;font-size:14.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button:hover{color:var(--ink);background:var(--soft)}
.seg button.on{background:var(--ink);color:var(--card);box-shadow:0 4px 12px rgba(22,33,62,.22)}
.right{grid-area:right;display:flex;gap:8px;align-items:center}
.sub{grid-area:sub;display:flex;gap:8px;align-items:center;min-width:0}
.sub .pill{padding:7px 13px;font-size:14px}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.prog .bar{flex:1;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#3fd39a);border-radius:99px;transition:width .5s}
.prog b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.prog .ttl{overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--display);font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 14px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.18)}}
.go{background:linear-gradient(140deg,var(--red),var(--red2));color:#fff;border-color:transparent}
.zoom{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;padding:0;font-size:20px;line-height:1;font-weight:500}
@media(max-width:900px){
  .top{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"brand right" "tabs tabs" "sub sub"}
  .right{justify-content:flex-end}
  .tabrow{justify-content:flex-start}
}
@media(max-width:520px){.brand small{display:none}.brand b{font-size:17px}.zoom{top:42%}}
/* 아래 카드 */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;width:min(740px,calc(100% - 20px));display:flex;flex-direction:column;align-items:center}
.stats{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:5px 18px 4px;font-size:12px;color:var(--muted);display:flex;gap:16px;font-variant-numeric:tabular-nums}
.stats b{font-weight:700;font-size:14px;color:var(--ink);margin-right:3px}
.card{width:100%;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);padding:18px 22px}
.card.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-10px)}60%{transform:translateX(10px)}}
@media(min-width:900px){body.home .dock{left:auto;right:16px;bottom:auto;top:calc(50% + 30px);transform:translateY(-50%);width:390px}}
/* 문제 */
#play{display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:center}
.photo{width:136px;height:136px;border-radius:20px;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative;box-shadow:0 6px 16px rgba(22,33,62,.12)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#qArt,#qArt svg,#lArt svg{width:100%;height:100%;display:block}
.photo .cl{animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(16px)}}
#play .tip{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.01em}
#qMean{grid-column:1/-1;margin:0 0 4px;font-size:15px;line-height:1.45;color:var(--ink)}
@media(max-width:560px){.photo{width:88px;height:88px;border-radius:16px}.card{padding:14px 16px}#ans,.slots{font-size:20px}#ans{letter-spacing:.08em}#play{gap:6px 12px}.side{min-width:84px}}
#play .meta{grid-column:1/-1;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
#play .meta em{font-style:normal;font-weight:700;color:var(--red)}
.han{font-family:var(--hanja);font-weight:900;font-size:clamp(36px,8vw,56px);line-height:1.08;letter-spacing:.05em;word-break:keep-all}
.typing{position:relative;margin-top:4px}
#ans{font-family:var(--body);font-weight:700;font-size:clamp(24px,6vw,32px);color:var(--ink);background:transparent;border:0;width:100%;padding:0 0 10px;letter-spacing:.14em;caret-color:var(--blue)}
#ans:focus{outline:0}
#ans::placeholder{color:var(--line2);font-weight:500;letter-spacing:.06em}
#ans.cho::placeholder{color:var(--blue);opacity:.6;font-weight:700;letter-spacing:.3em}
.slots{position:absolute;left:0;bottom:0;display:flex;gap:.25em;font-size:clamp(24px,6vw,32px);pointer-events:none}
.slots i{display:block;width:1em;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
.slots i.f{background:var(--blue)}
.side{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:96px}
.side button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 14px;font-weight:600;font-size:13.5px;transition:border-color .15s,transform .15s}
.side button:hover{border-color:var(--line2);transform:translateY(-1px)}
.side button[type=submit]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.side .left{font-size:11.5px;font-weight:600;color:var(--muted);text-align:right}
.side .left b{display:block;font-family:var(--display);font-weight:900;font-size:22px;color:var(--ink);line-height:1.1}
#done .read{font-family:var(--body);font-weight:700;font-size:clamp(28px,7vw,40px);color:var(--green-ink);line-height:1.15}
#done .read small{font-size:.5em;color:var(--gold);margin-left:8px}
#done p{margin:4px 0 0;font-size:15px}
/* 모드 고르기 · 미리 익히기 */
#pick h2{font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-.02em;margin:0}
#pick p{margin:2px 0 14px;font-size:14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modes button{position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:4px;min-height:104px;transition:transform .15s,box-shadow .15s,border-color .15s}
.modes button:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line2)}
.modes b{font-weight:700;font-size:17px;position:relative}
.modes span{font-size:12.5px;color:var(--muted);line-height:1.45;position:relative}
.modes .mk{position:absolute;right:-4px;bottom:-18px;font-family:var(--hanja);font-weight:900;font-size:72px;font-style:normal;line-height:1;opacity:.07}
.modes #mCho b{color:var(--blue)}
.modes #mCho .mk{color:var(--blue);opacity:.1}
.modes #mQuiz{background:linear-gradient(140deg,var(--red),var(--red2));border-color:transparent;color:#fff;box-shadow:0 10px 24px color-mix(in srgb,var(--red) 30%,transparent)}
.modes #mQuiz span{color:#fff;opacity:.88}
.modes #mQuiz .mk{opacity:.18}
@media(max-width:620px){.modes{grid-template-columns:1fr}.modes button{min-height:0}}
.lhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:var(--muted);margin-bottom:8px}
.lhead b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.lbody{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;touch-action:pan-y}
.lbody.slide{animation:slide .28s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
.lread{font-weight:700;font-size:clamp(22px,5vw,28px);color:var(--green-ink);line-height:1.2;letter-spacing:.06em}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.lchips span{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:5px 8px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:11.5px;font-weight:500;color:var(--muted);line-height:1.25}
.lchips b{font-family:var(--hanja);font-weight:900;font-size:22px;color:var(--ink);line-height:1.2}
#lMean{margin:0;font-size:15px}
.lnav{display:flex;gap:8px;align-items:center;margin-top:12px}
.lnav button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.lnav button:hover{border-color:var(--line2)}
.lnav button:disabled{opacity:.35;cursor:default}
.lnav .cta{background:linear-gradient(140deg,var(--red),var(--red2));border-color:transparent;color:#fff}
.ldots{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.ldots i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
/* 지역 고르기 */
#home h2{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:-.02em;margin:0 0 2px}
#home p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.schoolrow{display:flex;gap:8px;margin-bottom:14px}
.schoolrow input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:9px 12px}
.schoolrow input:focus{background:var(--card);border-color:var(--line2);outline:0}
.schoolrow button{border:0;border-radius:12px;background:var(--ink);color:var(--card);padding:9px 14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 11px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:baseline;transition:transform .15s,border-color .15s}
.chip i{font-style:normal;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink);transform:translateY(-1px)}
.chip.lock{color:var(--muted);opacity:.7}
.chip.clear{background:var(--land-clear);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.chip.clear i{color:var(--green-ink)}
.chip.next{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 25%,transparent)}
#toast{position:fixed;left:50%;top:118px;transform:translateX(-50%);z-index:8;max-width:calc(100% - 24px);text-align:center;white-space:normal;border-radius:14px;transition:opacity .3s;pointer-events:none}
#toast.hide{opacity:0}
@media(max-width:900px){#toast{top:168px}}
#clear{position:fixed;inset:0;z-index:10;display:none;place-items:center;pointer-events:none}
#clear.on{display:grid}
#clear div{font-family:var(--display);font-weight:900;font-size:clamp(30px,7vw,56px);letter-spacing:-.02em;text-align:center;line-height:1.2;animation:boom 2.4s both;color:var(--ink);paint-order:stroke;-webkit-text-stroke:6px var(--card)}
#clear b{display:grid;place-items:center;width:1.9em;height:1.9em;margin:0 auto .15em;border-radius:22%;background:linear-gradient(140deg,var(--red),var(--red2));color:#fff;font-family:var(--hanja);font-size:1.3em;-webkit-text-stroke:0;transform:rotate(-8deg);box-shadow:0 12px 30px color-mix(in srgb,var(--red) 40%,transparent)}
@keyframes boom{0%{transform:scale(0) rotate(-15deg)}16%{transform:scale(1.15) rotate(3deg)}26%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
/* 순위 */
#rankBox{position:fixed;right:12px;top:118px;z-index:7;width:min(380px,calc(100% - 24px));max-height:calc(100% - 138px);display:none;flex-direction:column;gap:8px}
@media(max-width:900px){#rankBox{top:168px;max-height:calc(100% - 188px)}}
#rankBox.open{display:flex}
#rankBox h2{font-family:var(--display);font-weight:900;font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center}
#rankBox h2 button{border:0;background:transparent;font-size:22px;line-height:1;padding:0 4px;color:var(--muted)}
#rankBox .note{font-size:12.5px;color:var(--muted);margin:0}
.tablebox{overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:11.5px;color:var(--muted);font-weight:600}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{font-family:var(--display);font-weight:900;text-align:center}
tr.mine td{background:color-mix(in srgb,var(--gold) 18%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

const midY=()=>S.sel===null?(wide()?H*.53:H*.33):H*.42;
function fit(b,fw,fh){const s=Math.min(W*fw/(b[2]-b[0]),H*fh/(b[3]-b[1]));return {x:(b[0]+b[2])/2,y:(b[1]+b[3])/2,s}}
function goNation(){const NB=isD()?[226,690,470,930]:[268,68,823,1152];G=wide()?fit(NB,(W-420)/W*.92,.82):fit(NB,.9,.5)}
function goRegion(id){G=fit(BYID[id].geo.box,.8,.5)}
function goPin(p){const base=fit(p.r.geo.box,.8,.5).s;G={x:p.x,y:p.y,s:Math.max(base*1.15,Math.min(isD()?95:34,60/p.near))}}
function applyView(){
  world.setAttribute('transform','translate('+(midX()-V.x*V.s)+','+(midY()-V.y*V.s)+') scale('+V.s+')');
  const sx=x=>midX()+(x-V.x)*V.s,sy=y=>midY()+(y-V.y)*V.s;
  PINS.forEach(p=>{if(p.g.style.display!=='none')p.g.setAttribute('transform','translate('+sx(p.x).toFixed(1)+','+sy(p.y).toFixed(1)+')')});
  REG.forEach(r=>{const n=nameEls[r.id];if(n.g.style.display!=='none')n.g.setAttribute('transform','translate('+sx(n.p[0]).toFixed(1)+','+sy(n.p[1]).toFixed(1)+')')});
  const h=$('hero');h.style.display=hero.on?'':'none';
  if(hero.on)h.setAttribute('transform','translate('+(sx(hero.x)-24).toFixed(1)+','+(sy(hero.y)-6+Math.sin(clock*6)*2).toFixed(1)+')');
}
function resize(){W=innerWidth;H=innerHeight;const fx=$('fx');fx.width=W;fx.height=H}
/* 손으로 움직이기 */
const ptr=new Map();let moved=0,pinch=0;
map.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;map.setPointerCapture(e.pointerId);map.classList.add('drag');
  if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
map.addEventListener('pointermove',e=>{const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size===1){G.x=V.x=V.x-dx/V.s;G.y=V.y=V.y-dy/V.s;G.s=V.s}
  else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){G.s=V.s=clampS(V.s*d/pinch)}pinch=d}});
function up(e){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);map.classList.remove('drag');pinch=0;
  if(moved<8&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY);tap(t)}}
map.addEventListener('pointerup',up);map.addEventListener('pointercancel',up);
const clampS=s=>Math.max(.35,Math.min(130,s));
map.addEventListener('wheel',e=>{e.preventDefault();G.s=clampS(G.s*Math.exp(-e.deltaY*.0015))},{passive:false});
$('zin').onclick=()=>{G.s=clampS(G.s*1.5)};$('zout').onclick=()=>{G.s=clampS(G.s/1.5)};
function tap(t){
  if(!t||busy)return;
  const pin=t.closest&&t.closest('.pin');
  if(pin){const k=+pin.getAttribute('data-k'),p=PINS[k];
    if(mode==='learn'){learnIdx=Math.max(0,order.indexOf(k));showLearn();return}
    if(S.solved[iid(p.r,p.i)]!=null){const it=p.r.items[p.i];toast(it[0]+' '+it[1]+' · '+it[3],3500);return}
    mode='quiz';setTarget(k);return}
  const reg=t.closest&&t.closest('.reg');
  if(reg&&reg.getAttribute('data-id')!==S.sel)select(reg.getAttribute('data-id'));
}

const fxc=$('fx').getContext('2d');let bits=[];
function confetti(n,x,y){const cols=['#f2b705','#e03131','#2f9e44','#1d6fd6','#9c6ade','#ff922b'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*8;bits.push({x:x??W/2,y:y??H*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:4+Math.random()*6,c:cols[i%cols.length],l:1,w:Math.random()*6})}}
function drawFx(dt){fxc.clearRect(0,0,W,H);if(!bits.length)return;
  bits=bits.filter(p=>p.l>0);bits.forEach(p=>{p.vy+=22*dt;p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.l-=dt*.6;p.w+=dt*10;
    fxc.globalAlpha=Math.max(0,p.l);fxc.fillStyle=p.c;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.w);fxc.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);fxc.restore()});fxc.globalAlpha=1}
let last=0,clock=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;
  const k=1-Math.pow(.0015,dt);
  V.x+=(G.x-V.x)*k;V.y+=(G.y-V.y)*k;V.s*=Math.pow(G.s/V.s,k);
  if(cur!=null){const p=PINS[cur],hk=1-Math.pow(.01,dt);hero.x+=(p.x-hero.x)*hk;hero.y+=(p.y-hero.y)*hk}
  applyView();drawFx(dt);
}

function regionKeys(id){return PINS.map((p,k)=>k).filter(k=>PINS[k].r.id===id)}
function unsolved(id){return regionKeys(id).filter(k=>S.solved[iid(PINS[k].r,PINS[k].i)]==null)}
function nearest(list,from){let best=null,bd=1e9;list.forEach(k=>{const d=from==null?PINS[k].y:Math.hypot(PINS[k].x-PINS[from].x,PINS[k].y-PINS[from].y);if(d<bd){bd=d;best=k}});return best}
function select(id){
  if(busy)return;
  const u=unlocked();
  if(id&&!u.has(id)){const from=REG.filter(r=>(r.opens||[]).includes(id)).map(r=>r.name);
    toast(BYID[id].name+'은(는) 아직 잠겨 있어요. '+from.join(' 또는 ')+'부터 클리어하세요',3500);return}
  S.sel=id;cur=null;route=[];skipped.clear();hero.on=false;
  if(!id){mode=null;goNation();render();return}
  mode='pick';goRegion(id);render();
}
let hintMode=false;
function startQuiz(h){
  hintMode=h===true;
  const left=unsolved(S.sel);
  if(!left.length){toast('이 지역은 모두 맞혔어요. 미리 익히기로 다시 볼 수 있어요',3500);return}
  mode='quiz';route=[];skipped.clear();setTarget(nearest(left,null));
}
function tour(id){const left=new Set(regionKeys(id)),out=[];let c=nearest([...left],null);
  while(c!=null){out.push(c);left.delete(c);c=left.size?nearest([...left],c):null}return out}
function startLearn(){mode='learn';order=tour(S.sel);learnIdx=0;showLearn()}
function showLearn(){

function stepLearn(d){const n=learnIdx+d;if(n<0||n>=order.length)return;learnIdx=n;showLearn()}

function art(kind,seed){

  const hill=night?'#34447a':['#a6dcae','#c3e6c0','#e6c98e'][se];

    b='<path d="M66,62 C40,70 96,82 56,95 C34,103 62,111 46,120 H100 C108,110 82,104 98,94 C128,80 72,72 88,62Z" fill="'+wc+'"/><path d="M60,104 h16 l-3,5 h-10z" fill="'+wood+'"/><path d="M68,90 v14 h-8z" fill="#fff"/>'+tree(18,100,.75)+tree(108,92,.6)+pine(34,84,.45);
  }else if(kind==='person'){
    b=pine(16,100,.8)+tree(104,100,.7)+'<ellipse cx="60" cy="108" rx="20" ry="4" fill="#000" opacity=".12"/><path d="M44,108 L53,74 H67 L76,108Z" fill="#f4f1e8"/><path d="M53,74 L40,92 L46,96 L56,84Z M67,74 L80,92 L74,96 L64,84Z" fill="#e8e3d4"/><path d="M57,76 L60,96 L63,76Z" fill="#5b8def"/><circle cx="60" cy="64" r="9" fill="#ffd9b8" stroke="#1b1c22" stroke-width="1.2"/><ellipse cx="60" cy="57" rx="18" ry="3.6" fill="#1b1c22"/><path d="M52,57 L54,44 H66 L68,57Z" fill="#1b1c22"/><circle cx="56.5" cy="65" r="1.1" fill="#1b1c22"/><circle cx="63.5" cy="65" r="1.1" fill="#1b1c22"/><path d="M57,69 q3,2 6,0" stroke="#1b1c22" stroke-width="1" fill="none"/>';
  }else if(kind==='event'){
    b=R(0,88,120,14,stone);
    for(let x=2;x<120;x+=12)b+=R(x,82,7,6,stone);
    b+='<path d="M0,95 H120 M20,88 V95 M50,95 V102 M80,88 V95 M104,95 V102" stroke="'+stoneD+'" stroke-width="1" fill="none"/>'+R(33,40,2.2,48,wood)+'<path d="M35.2,41 h26 l-7,8 l7,8 h-26z" fill="'+red+'"/>'+R(79,48,2.2,40,wood)+'<path d="M81.2,49 h22 l-6,7 l6,7 h-22z" fill="#3b6fd1"/>'+R(57,58,1.6,30,wood)+'<path d="M58.6,59 h14 l-4,5 l4,5 h-14z" fill="#f2b705"/>';
  }else if(kind==='school'){
    b=R(18,70,84,32,'#f3ead8')+R(48,58,24,44,'#fbf6ea')+'<path d="M44,58 L60,46 L76,58Z" fill="'+red+'"/><circle cx="60" cy="66" r="5" fill="#fff" stroke="'+wood+'" stroke-width="1.5"/><path d="M60,63 V66 H62" stroke="'+wood+'" stroke-width="1" fill="none"/>'+R(55,88,10,14,'#7a4a2c');
    for(let i=0;i<3;i++)b+=R(23+i*8,76,5,7,'#9fd3ee')+R(23+i*8,89,5,7,'#9fd3ee')+R(77+i*8,76,5,7,'#9fd3ee')+R(77+i*8,89,5,7,'#9fd3ee');
    b+=R(59.3,32,1.4,14,wood)+'<path d="M60.7,33 h11 l-3,3.5 l3,3.5 h-11z" fill="#3b6fd1"/>'+tree(9,102,.6)+tree(111,102,.6);
  }else if(kind==='town'){
    const house=(x,y,w,c)=>R(x,y,w,12,'#f3ead8')+R(x+w/2-2,y+5,4,7,'#7a4a2c')+'<path d="M'+(x-4)+','+(y+1)+' Q'+(x+w/2)+','+(y-13)+' '+(x+w+4)+','+(y+1)+'Z" fill="'+c+'"/>';
    b=house(10,80,22,roofC)+house(44,74,30,night?'#18243a':'#3b4a6b')+house(84,82,24,roofC)+house(26,92,26,'#c9a45a')+house(66,94,28,'#c9a45a')+'<path d="M0,112 Q60,104 120,112 V120 H0Z" fill="'+stoneD+'"/>'+tree(112,100,.5)+tree(6,104,.5);
  }else{
    b='<path d="M-6,100 L35,32 L62,80 L83,46 L126,100Z" fill="'+(night?'#3f6a63':'#6aa97a')+'"/><path d="M35,32 L62,80 L50,100 L20,100Z" fill="#000" opacity=".08"/><path d="M35,32 l-9,15 l6,-3 l4,5 l5,-6 l4,3z M83,46 l-7,11 l5,-2 l3,4 l4,-4 l3,2z" fill="#fff"/>'+pine(14,100,.6)+pine(100,100,.7)+pine(58,102,.5);
  }
  let sky='<circle cx="94" cy="24" r="11" fill="'+SKY[2]+'"/>';
  if(night)sky+='<circle cx="89" cy="21" r="10" fill="#2a3768"/><g fill="#fff"><circle cx="20" cy="18" r="1"/><circle cx="44" cy="10" r=".8"/><circle cx="66" cy="22" r="1"/><circle cx="110" cy="46" r=".8"/><circle cx="30" cy="38" r=".7"/></g>';
  else sky+='<g class="cl" fill="#fff" opacity=".9"><ellipse cx="26" cy="24" rx="13" ry="5"/><ellipse cx="33" cy="20" rx="9" ry="5"/><ellipse cx="66" cy="14" rx="9" ry="3.5"/></g>';
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="artSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+SKY[0]+'"/><stop offset="1" stop-color="'+SKY[1]+'"/></linearGradient></defs><rect width="120" height="120" fill="url(#artSky)"/>'+sky+'<path d="M0,86 Q25,60 55,80 T120,72 V120 H0Z" fill="'+hill+'"/><path d="M0,94 Q60,86 120,94 V120 H0Z" fill="'+ground+'"/>'+b+'</svg>';
}
let photoId='';
function showPhoto(id,it){
  if(photoId===id)return;photoId=id;
  $('qArt').innerHTML=art(it[6],it[0]);
  const im=$('qImg');im.hidden=true;im.alt=it[1]+' 사진';
  im.onload=()=>{if(photoId===id)im.hidden=false};im.onerror=()=>{im.hidden=true};
  im.src='photos/'+id+'.jpg';
}
function paintSlots(){
  if(cur==null)return;const ans=PINS[cur].r.items[PINS[cur].i][1],n=norm($('ans').value).length,box=$('slots');
  if(box.children.length!==ans.length){box.replaceChildren();for(let i=0;i<ans.length;i++)box.append(el('i'))}
  [...box.children].forEach((c,i)=>c.className=i<n?'f':'');
}
let composing=false;
const ansEl=$('ans');
ansEl.addEventListener('compositionstart',()=>composing=true);
ansEl.addEventListener('compositionend',()=>{composing=false;check(false)});
ansEl.addEventListener('input',()=>{paintSlots();check(false)});
ansEl.addEventListener('keydown',e=>{if(e.key===' '&&!ansEl.value){e.preventDefault();skip()}});
$('play').addEventListener('submit',e=>{e.preventDefault();check(true)});
$('skip').onclick=skip;
const revealed=new Set();
$('reveal').onclick=()=>{
  if(cur==null||busy)return;
  const p=PINS[cur],id=iid(p.r,p.i);
  revealed.add(id);S.tries[id]=Math.max(2,S.tries[id]||0);saveLocal();
  render();ansEl.focus();
};
function check(force){
  if(cur==null||busy)return;
  const p=PINS[cur],it=p.r.items[p.i],v=norm(ansEl.value);
  if(v===it[1])return correct();
  if(force?v.length>0:(!composing&&v.length>it[1].length))wrong();
}
function wrong(){
  const p=PINS[cur],id=iid(p.r,p.i);S.tries[id]=(S.tries[id]||0)+1;saveLocal();
  ansEl.value='';ansEl.blur();const c=$('card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  render();if(!revealed.has(id))$('qFb').textContent=S.tries[id]>=2?'초성 힌트 '+chosung(p.r.items[p.i][1]):'아직 아니에요. 다시 쳐 보세요';
  setTimeout(()=>ansEl.focus(),30);
}
function correct(){
  const p=PINS[cur],r=p.r,it=r.items[p.i],id=iid(r,p.i),before=unlocked();
  let got=PTS[Math.min(S.tries[id]||0,PTS.length-1)];if(hintMode)got=Math.min(got,7);S.solved[id]=got;busy=true;
  ansEl.value='';ansEl.blur();
  p.pop=true;setTimeout(()=>{p.pop=false},600);
  confetti(36,midX()+(p.x-V.x)*V.s,midY()+(p.y-V.y)*V.s);
  const sb=$('scoreBox');sb.classList.remove('bump');void sb.offsetWidth;sb.classList.add('bump');
  $('dHan').textContent=it[0];$('dRead').replaceChildren(document.createTextNode(it[1]),el('small',null,'+'+got+'점'));$('dMean').textContent=it[3];
  $('done').dataset.on='1';const solvedK=cur;render();renderBoard();push();
  setTimeout(()=>{
    $('done').dataset.on='';busy=false;
    const left=unsolved(r.id);
    if(left.length){const pool=left.filter(k=>!skipped.has(k));setTarget(nearest(pool.length?pool:left,solvedK))}
    else celebrate(r,before);
  },1200);
}
function skip(){
  if(cur==null||busy)return;
  const left=unsolved(S.sel).filter(k=>k!==cur);if(!left.length){toast('이 지역에 남은 문화재는 이것뿐이에요');return}
  skipped.add(cur);let pool=left.filter(k=>!skipped.has(k));if(!pool.length){skipped.clear();pool=left}
  setTarget(nearest(pool,cur));
}
function celebrate(r,before){
  busy=true;cur=null;hero.on=false;mode='pick';
  const fresh=[...unlocked()].filter(x=>!before.has(x)).map(x=>BYID[x].name);
  $('clearTxt').replaceChildren(el('b',null,'通'),document.createTextNode(r.name+' 클리어 +'+BONUS+'점'));
  const c=$('clear');c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
  for(let i=0;i<5;i++)setTimeout(()=>confetti(50,W*(.2+Math.random()*.6),H*(.25+Math.random()*.3)),i*220);
  goRegion(r.id);render();renderBoard();push();
  setTimeout(()=>{c.classList.remove('on');busy=false;S.sel=null;mode=null;route=[];goNation();render();
    toast(clearedIds().length===REG.length?'모든 지역 완주! 축하합니다':'다음 지역을 골라 보세요',4500)},2300);
}
function renderBoard(){
  const rows=new Map();
  const add=(school,pts,cl)=>{const k=norm(school);if(!k)return;const o=rows.get(k)||{name:school,pts:0,n:0,cl:0};o.pts+=pts;o.n++;o.cl+=cl;rows.set(k,o)};
  let mineIn=false;
  if(board)board.forEach(d=>{
    if(d.id===uid){mineIn=true;add(S.school,points(),clearedAll().length);return}
    const x=d.data()||{};
    add(cleanSchool(x.school),Math.max(0,Math.min(MAX,Number(x.points)||0)),Array.isArray(x.cleared)?Math.min(REGIONS.length*5+DREG.length*2,x.cleared.length):0);
  });
  if(!mineIn)add(S.school,points(),clearedAll().length);
  const list=[...rows.values()].sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name,'ko'));
  const tb=$('rank');tb.replaceChildren();const mk=norm(S.school);
  list.forEach((o,i)=>{const tr=el('tr',mk&&norm(o.name)===mk?'mine':null);
    [i+1,o.name,o.n+'명',o.cl+'곳',o.pts].forEach(v=>tr.append(el('td',null,v)));tb.append(tr)});
  if(!list.length){const tr=el('tr'),td=el('td',null,'아직 점수를 올린 학교가 없어요. 학교 이름을 저장하고 첫 문제를 풀어 보세요.');td.colSpan=5;td.style.textAlign='left';tr.append(td);tb.append(tr)}
  const dl=$('schools');dl.replaceChildren();list.forEach(o=>{const op=el('option');op.value=o.name;dl.append(op)});
}
function saveSchool(){const v=cleanSchool($('school').value);S.school=v;$('school').value=v;
  toast(v?v+' 이름으로 점수가 쌓입니다':'학교 이름을 넣으면 학교 점수에 더해집니다');renderBoard();push()}
$('saveSchool').onclick=saveSchool;
$('school').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveSchool()}});
$('rankBtn').onclick=()=>$('rankBox').classList.toggle('open');
$('rankX').onclick=()=>$('rankBox').classList.remove('open');
function goBack(){if(busy)return;if(S.sel&&mode!=='pick'){const id=S.sel;S.sel=null;select(id)}else select(null)}
$('backBtn').onclick=goBack;
function setCat(c){
  if(busy)return;
  if(c===CAT)return;
  const was=REG;CAT=c;REG=isD()?DREG.filter(r=>r[c].length):REGIONS;S.sel=null;mode=null;cur=null;route=[];skipped.clear();hero.on=false;photoId='';
  if(was!==REG)buildMap();
  [...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  $('home').querySelector('h2').textContent=c==='d'?'어느 시·군의 동네를 풀까요?':c==='s'?'어느 시·군의 학교를 풀까요?':'어디부터 풀까요?';
  buildPins();goNation();render();renderBoard();
  toast({h:'전국 문화재 이름을 한자로 맞혀 보세요',m:'전국 산 이름을 한자로 맞혀 보세요',p:'전국 지명을 한자로 맞혀 보세요',d:'지도에서 시·군을 고르면 동네 이름이 한자로 나옵니다',r:'전국 강과 호수 이름을 한자로 맞혀 보세요',y:'역사 인물과 사건을 한자로 맞혀 보세요',s:'전남·광주 고등학교와 중학교 이름을 한자로 맞혀 보세요'}[c],3500);
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setCat(b.dataset.c)});
$('homeBtn').onclick=()=>{if(busy)return;$('rankBox').classList.remove('open');select(null)};
$('mLearn').onclick=startLearn;$('mQuiz').onclick=()=>startQuiz(false);$('mCho').onclick=()=>startQuiz(true);$('lQuiz').onclick=()=>startQuiz(false);
$('lPrev').onclick=()=>stepLearn(-1);$('lNext').onclick=()=>stepLearn(1);
let swipeX=null;
$('lBody').addEventListener('pointerdown',e=>{swipeX=e.clientX});
$('lBody').addEventListener('pointerup',e=>{if(swipeX==null)return;const d=e.clientX-swipeX;swipeX=null;if(Math.abs(d)>50)stepLearn(d<0?1:-1)});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sel)goBack();
  if(mode==='learn'&&(e.key==='ArrowRight'||e.key===' ')){e.preventDefault();stepLearn(1)}
  if(mode==='learn'&&e.key==='ArrowLeft'){e.preventDefault();stepLearn(-1)}
});

/* ---------- 공유 점수 ---------- */
async function connect(){
  let ok=false;
  for(let i=0;i<30&&!ok;i++){ok=!!(window.claude&&window.claude.use);if(!ok)await new Promise(r=>setTimeout(r,200))}
  if(!ok)return offline();
  const [d,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!d)return offline();
  db=d;
  try{uid=user?await user.id():null}catch(e){uid=null}
  if(uid){try{myDoc=db.doc('scores/'+uid);const snap=await myDoc.get();
    if(snap.exists){applySaved(snap.data());render();renderBoard()}}catch(e){myDoc=null}}
  const timer=setTimeout(()=>{$('rankNote').textContent='순위에 아직 연결되지 않았습니다. 보이는 점수는 최신이 아닐 수 있습니다.'},10000);
  db.collection('scores').onSnapshot(q=>{board=q.docs;renderBoard();
    if(!q.metadata.fromCache){clearTimeout(timer);$('rankNote').textContent='같은 학교 이름으로 참여한 사람의 점수를 모두 더합니다. 맞힐 때마다 바로 반영됩니다.'}
  },()=>{clearTimeout(timer);$('rankNote').textContent='순위를 불러오지 못했습니다. 내 점수는 이 기기에 저장됩니다.'});
  if(!uid)canWrite=false;
}
function offline(){$('rankNote').textContent='지금은 공유 순위에 연결되지 않아 내 점수만 보입니다. 점수는 이 기기에 저장됩니다.'}

function start(saved){
  loadLocal();
  if(saved&&saved.solved)S=Object.assign(S,saved);
  S.sel=null;
  buildMap();buildPins();resize();goNation();V=Object.assign({},G);
  render();renderBoard();
  addEventListener('resize',()=>{resize();if(cur!=null)goPin(PINS[cur]);else if(S.sel)goRegion(S.sel);else goNation()});
  requestAnimationFrame(frame);
  connect();
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({school:S.school,solved:S.solved,tries:S.tries}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
</script>
